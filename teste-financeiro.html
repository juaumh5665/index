<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StackOS — Teste Financeiro Automatizado</title>
<style>
:root {
    --bg: #0a0a0b; --card: #141416; --border: #27272a; --gold: #fbbf24;
    --green: #22c55e; --red: #ef4444; --cyan: #06b6d4; --text: #e4e4e7;
    --muted: #71717a; --font: 'Segoe UI', system-ui, sans-serif;
    --mono: 'Consolas', 'Fira Code', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font); padding: 1.5rem; line-height: 1.6; }
h1 { color: var(--gold); font-size: 1.6rem; margin-bottom: .3rem; }
h2 { color: var(--cyan); font-size: 1.15rem; margin: 1.5rem 0 .5rem; border-bottom: 1px solid var(--border); padding-bottom: .3rem; }
h3 { color: var(--text); font-size: .95rem; margin: .8rem 0 .3rem; }
.subtitle { color: var(--muted); font-size: .85rem; margin-bottom: 1.5rem; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: .6rem; padding: 1rem; margin: .5rem 0; }
.pass { color: var(--green); font-weight: 700; }
.fail { color: var(--red); font-weight: 700; }
.warn { color: #f59e0b; font-weight: 700; }
.money { font-family: var(--mono); color: var(--gold); }
.neg { color: var(--red); }
.pos { color: var(--green); }
table { width: 100%; border-collapse: collapse; margin: .5rem 0; font-size: .85rem; }
th { text-align: left; color: var(--muted); font-size: .7rem; text-transform: uppercase; letter-spacing: .05em; padding: .4rem .6rem; border-bottom: 1px solid var(--border); }
td { padding: .35rem .6rem; border-bottom: 1px solid #1a1a1e; }
tr:hover { background: #1a1a1e; }
.summary-box { display: flex; gap: 1rem; flex-wrap: wrap; margin: 1rem 0; }
.stat { background: var(--card); border: 1px solid var(--border); border-radius: .6rem; padding: .8rem 1rem; min-width: 140px; flex: 1; }
.stat-label { font-size: .65rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.stat-value { font-size: 1.3rem; font-weight: 800; font-family: var(--mono); margin-top: .2rem; }
.test-result { display: flex; align-items: center; gap: .5rem; padding: .3rem 0; font-size: .85rem; }
.test-result .icon { font-size: 1rem; }
.log { background: #0d0d0e; border: 1px solid var(--border); border-radius: .4rem; padding: .8rem; font-family: var(--mono); font-size: .75rem; max-height: 400px; overflow-y: auto; white-space: pre-wrap; color: var(--muted); }
.badge { display: inline-block; padding: .1rem .5rem; border-radius: .3rem; font-size: .7rem; font-weight: 700; }
.badge-buyin { background: #1e3a5f; color: #60a5fa; }
.badge-reentry { background: #3b1f57; color: #c084fc; }
.badge-addon { background: #1a3a2a; color: #4ade80; }
.badge-estorno { background: #3b1515; color: #f87171; }
.badge-pagamento { background: #3b3415; color: #fbbf24; }
.badge-deposito { background: #153b2e; color: #34d399; }
#results { min-height: 200px; }
</style>
</head>
<body>

<h1>🃏 StackOS — Teste Financeiro Automatizado</h1>
<p class="subtitle">Simulação completa: Torneio nos moldes Spartan 15k • Todas as entradas • Estornos • Pagamentos • Validação de saldos</p>

<div id="results">
    <div class="card" style="text-align:center; color:var(--muted);">
        ⏳ Executando simulação...
    </div>
</div>

<script>
// ========================================================================
// MOTOR FINANCEIRO — Extraído fielmente do app.html (ZERO alterações na lógica)
// ========================================================================

// --- Helpers ---
function _genUuid() {
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
        const r = Math.random() * 16 | 0;
        return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
    });
}
function formatMoney(v) {
    return 'R$ ' + Number(v).toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}

// --- Estado global da simulação ---
let transacoes = [];
const _txDedupMap = new Map();
const TX_DEDUP_WINDOW = 2000;

// --- registrarTransacao (app.html ~line 40669) ---
function registrarTransacao(dados) {
    const dedupKey = `${dados.jogadorId}|${dados.tipo}|${dados.valor}`;
    const now = Date.now();
    const lastTs = _txDedupMap.get(dedupKey);
    if (lastTs && (now - lastTs) < TX_DEDUP_WINDOW) {
        console.warn('[DEDUP] Transação duplicada bloqueada:', dedupKey);
        return null;
    }
    _txDedupMap.set(dedupKey, now);
    if (_txDedupMap.size > 200) {
        for (const [k, v] of _txDedupMap) {
            if (now - v > TX_DEDUP_WINDOW * 5) _txDedupMap.delete(k);
        }
    }
    const t = { id: _genUuid(), ts: now, fechamentoId: null, ...dados };
    transacoes.push(t);
    return t;
}

// --- getSaldoJogador (app.html ~line 40698) ---
function getSaldoJogador(jogadorId) {
    return transacoes
        .filter(t => t.jogadorId === jogadorId)
        .reduce((s, t) => s + t.valor, 0);
}

// --- getSaldoJogadorCaixaGeral (app.html ~line 40709) ---
function getSaldoJogadorCaixaGeral(jogadorId) {
    return transacoes
        .filter(t => t.jogadorId === jogadorId && t.origem !== 'cash')
        .reduce((s, t) => s + t.valor, 0);
}

// --- removerTransacao / estorno (app.html ~line 40913) ---
function removerTransacao(id, motivo) {
    const t = transacoes.find(x => x.id === id);
    if (!t) return { ok: false, erro: 'Transação não encontrada' };
    if (t.fechamentoId) return { ok: false, erro: 'Transação já faz parte de fechamento' };
    if (t.estornada) return { ok: false, erro: 'Transação já foi estornada' };
    if (t.tipo === 'estorno') return { ok: false, erro: 'Não é possível estornar um estorno' };
    const jaEstornada = transacoes.some(x => x.estornoRef === t.id && x.tipo === 'estorno');
    if (jaEstornada) return { ok: false, erro: 'Transação já possui estorno registrado' };

    t.estornada = true;
    t.estornadaEm = Date.now();
    t.estornadaPor = 'Teste Automatizado';
    t.estornoMotivo = motivo || 'Teste';

    const estornoTx = {
        id: _genUuid(),
        jogadorId: t.jogadorId,
        tipo: 'estorno',
        valor: -t.valor,
        descricao: `Estorno: ${t.descricao}`,
        metodo: t.metodo || null,
        origem: t.origem || null,
        ts: Date.now(),
        fechamentoId: null,
        estornoRef: t.id,
        estornoMotivo: motivo || 'Teste',
        estornoPor: 'Teste Automatizado',
    };
    transacoes.push(estornoTx);
    return { ok: true, estorno: estornoTx, original: t };
}

// --- Funções de cálculo do torneio (NÃO MODIFICADAS) ---
function _lastChancePagaRake(t) {
    if (t) {
        if (t.lastChancePagaRake === true) return true;
        if (t.lastChancePagaRake === false) return false;
    }
    return false;
}
function _staffFixoAtivo(t) {
    if (!t) return false;
    if (t.staffFixoAtivo === true) return true;
    if (t.staffFixoAtivo === false) return false;
    return false;
}
function _staffCascataAtivo(t) {
    if (!t) return false;
    if (t.staffCascataAtivo === true) return true;
    if (t.staffCascataAtivo === false) return false;
    return false;
}
function _isStaffFixoAdicionalV2(t) {
    return _staffFixoAtivo(t) && (t.staffFixoModo === 'adicional_v2');
}
function _getStaffFixoTotal(t) {
    if (!t || !_staffFixoAtivo(t)) return 0;
    const valor = Number(t.staffFixoValor) || 0;
    if (valor <= 0) return 0;
    const acoes = t.staffFixoAcoes || { buyin: true, rebuy: true, reentry: true, addon: true, last_chance: false };
    const lcPaga = _lastChancePagaRake(t);
    let qtd = 0;
    (t.entries || []).forEach(e => {
        if (e.tipo === 'last_chance' && !acoes.last_chance) return;
        const key = (e.tipo === 'rebuy_simples' || e.tipo === 'rebuy_duplo') ? 'rebuy'
            : (e.tipo === 'buyin_duplo') ? 'buyin' : e.tipo;
        if (acoes[key]) qtd++;
    });
    return qtd * valor;
}
function _getBrutoParaRake(t) {
    if (!t) return 0;
    let total = 0;
    const lcPaga = _lastChancePagaRake(t);
    (t.entries || []).forEach(e => {
        if (e.tipo === 'last_chance' && !lcPaga) return;
        total += Number(e.valor) || 0;
    });
    return total;
}
function _getBrutoSemRake(t) {
    if (!t) return 0;
    let total = 0;
    if (!_lastChancePagaRake(t)) {
        total += (t.entries || [])
            .filter(e => e.tipo === 'last_chance')
            .reduce((s, e) => s + (Number(e.valor) || 0), 0);
    }
    return total;
}
function getRake(t) {
    const bruto = _getBrutoParaRake(t);
    if (_staffFixoAtivo(t)) {
        const fixoModo = t.staffFixoModo || 'embutido';
        if (fixoModo === 'embutido') {
            const staffFixo = _getStaffFixoTotal(t);
            const base = Math.max(0, bruto - staffFixo);
            return base * ((Number(t.rake) || 0) / 100);
        }
        return bruto * ((Number(t.rake) || 0) / 100);
    }
    return bruto * ((Number(t.rake) || 0) / 100);
}
function getStaffFixo(t) {
    if (!_staffFixoAtivo(t)) return 0;
    return _getStaffFixoTotal(t);
}
function getStaffCascata(t) {
    if (!_staffCascataAtivo(t)) return 0;
    const brutoComRake = _getBrutoParaRake(t);
    const rake = getRake(t);
    let sobra;
    if (_staffFixoAtivo(t) && (t.staffFixoModo || 'embutido') === 'embutido') {
        sobra = brutoComRake - rake - getStaffFixo(t);
    } else {
        sobra = brutoComRake - rake;
    }
    return sobra * ((Number(t.staffPct) || 0) / 100);
}
function getStaff(t) {
    return getStaffCascata(t) + getStaffFixo(t);
}
function getPrize(t) {
    const brutoComRake = _getBrutoParaRake(t);
    const brutoSemRake = _getBrutoSemRake(t);
    const rake = getRake(t);
    let staffDoPrize = getStaffCascata(t);
    if (_staffFixoAtivo(t) && !_isStaffFixoAdicionalV2(t)) {
        staffDoPrize += getStaffFixo(t);
    }
    const liquido = (brutoComRake - rake - staffDoPrize) + brutoSemRake;
    if (t.tipo === 'knockout') return 0;
    else if (t.tipo === 'bounty') {
        const totalBounties = t.entries.filter(e => e.tipo !== 'addon' && e.tipo !== 'last_chance').length * (Number(t.bountyValor) || 0);
        return Math.max(0, liquido - totalBounties);
    } else if (t.tipo === 'pko') {
        return liquido * (1 - (Number(t.pkoSplit) || 0) / 100);
    }
    return Math.max(0, liquido);
}

// ========================================================================
// CONFIGURAÇÃO DO TORNEIO — Spartan 15k (simulado)
// ========================================================================
const TORNEIO_CONFIG = {
    id: _genUuid(),
    nome: 'Spartan 15k — Teste Financeiro',
    tipo: 'normal',
    buyin: 150,        // Buy-in R$ 150
    rake: 10,          // 10% rake
    stack: 15000,
    reentryAte: 6,
    addonValor: 100,
    addonFichas: 15000,
    rebuyValor: 150,
    rebuyFichas: 15000,
    rebuyDuploValor: 300,
    rebuyDuploFichas: 35000,
    lastChanceValor: 80,
    lastChanceFichas: 15000,
    lastChancePagaRake: false,
    // Staff cascata 5%
    staffCascataAtivo: true,
    staffFixoAtivo: false,
    staffPct: 5,
    // Sem taxa adm, sem bounty, sem promo
    taxaAdmValor: 0,
    bountyValor: 0,
    entries: [],
};

// ========================================================================
// JOGADORES SIMULADOS
// ========================================================================
const JOGADORES = [
    { id: _genUuid(), nome: 'Carlos Silva' },
    { id: _genUuid(), nome: 'Ana Santos' },
    { id: _genUuid(), nome: 'Pedro Oliveira' },
    { id: _genUuid(), nome: 'Marcos Lima' },
    { id: _genUuid(), nome: 'Julia Costa' },
    { id: _genUuid(), nome: 'Rafael Souza' },
    { id: _genUuid(), nome: 'Fernanda Rocha' },
    { id: _genUuid(), nome: 'Bruno Alves' },
    { id: _genUuid(), nome: 'Letícia Mendes' },
    { id: _genUuid(), nome: 'Gabriel Torres' },
];

// ========================================================================
// SIMULAÇÃO
// ========================================================================
const log = [];
const testResults = [];
let ts = Date.now();

function nextTs() { ts += 3000; return ts; } // 3s apart to avoid dedup

function addEntry(torneio, jogadorId, tipo) {
    let valor;
    switch(tipo) {
        case 'buyin': valor = torneio.buyin; break;
        case 'buyin_duplo': valor = torneio.buyin * 2; break;
        case 'reentry': valor = torneio.rebuyValor; break;
        case 'rebuy_simples': valor = torneio.rebuyValor; break;
        case 'rebuy_duplo': valor = torneio.rebuyDuploValor; break;
        case 'addon': valor = torneio.addonValor; break;
        case 'last_chance': valor = torneio.lastChanceValor || 0; break;
        default: valor = 0;
    }
    const entry = { id: _genUuid(), jogadorId, tipo, ts: nextTs(), valor };
    torneio.entries.push(entry);

    // Transaction tipo mapping (same as app.html line 30232)
    const tipoTx = (tipo === 'buyin' || tipo === 'buyin_duplo') ? 'buyin'
        : tipo === 'addon' ? 'addon'
        : tipo === 'last_chance' ? 'last_chance'
        : 'reentry';

    const jog = JOGADORES.find(j => j.id === jogadorId);
    const tx = registrarTransacao({
        jogadorId,
        tipo: tipoTx,
        valor: -valor,
        descricao: `${tipo.replace(/_/g,' ')} — ${torneio.nome}`,
        metodo: 'dinheiro',
        origem: 'torneio',
    });
    if (tx) tx.ts = entry.ts; // sync timestamps

    log.push(`📥 ${jog.nome}: ${tipo} R$ ${valor} (tx: ${tipoTx}, valor tx: -${valor})`);
    return { entry, tx };
}

function addDeposito(jogadorId, valor, metodo) {
    const jog = JOGADORES.find(j => j.id === jogadorId);
    const tx = registrarTransacao({
        jogadorId,
        tipo: 'deposito',
        valor: valor,
        descricao: `Depósito via ${metodo}`,
        metodo,
        origem: 'caixa',
    });
    if (tx) tx.ts = nextTs();
    log.push(`💵 ${jog.nome}: depósito +R$ ${valor} (${metodo})`);
    return tx;
}

function addPagamentoCash(jogadorId, valor, metodo) {
    const jog = JOGADORES.find(j => j.id === jogadorId);
    const saldoAtual = getSaldoJogador(jogadorId);
    const tx = registrarTransacao({
        jogadorId,
        tipo: 'pagamento_cash',
        valor: -valor,
        descricao: `Pagamento (Cash) via ${metodo}`,
        metodo,
        origem: 'cash',
    });
    if (tx) tx.ts = nextTs();
    log.push(`💰 ${jog.nome}: pagamento cash -R$ ${valor} (${metodo}) [saldo antes: ${formatMoney(saldoAtual)}]`);
    return tx;
}

function doEstorno(txId, motivo) {
    const t = transacoes.find(x => x.id === txId);
    const jog = t ? JOGADORES.find(j => j.id === t.jogadorId) : null;
    const result = removerTransacao(txId, motivo);
    if (result.ok) {
        result.estorno.ts = nextTs();
        log.push(`🔄 ${jog?.nome || '?'}: estorno de "${t.descricao}" (${formatMoney(Math.abs(t.valor))}) — ${motivo}`);
    } else {
        log.push(`❌ Estorno falhou: ${result.erro}`);
    }
    return result;
}

function assert(name, condition, detail) {
    testResults.push({ name, pass: condition, detail: detail || '' });
    if (!condition) log.push(`❌ FALHA: ${name} — ${detail || ''}`);
}

function assertMoney(name, actual, expected, tolerance) {
    tolerance = tolerance || 0.01;
    const pass = Math.abs(actual - expected) < tolerance;
    const detail = `esperado ${formatMoney(expected)}, obteve ${formatMoney(actual)}`;
    testResults.push({ name, pass, detail });
    if (!pass) log.push(`❌ FALHA: ${name} — ${detail}`);
}

// ========================================================================
// EXECUÇÃO DO TESTE
// ========================================================================
function runTest() {
    const T = TORNEIO_CONFIG;
    const P = JOGADORES;

    log.push('═══════════════════════════════════════════');
    log.push('  FASE 1: REGISTRAR ENTRADAS (BUY-INS)');
    log.push('═══════════════════════════════════════════');

    // -- 10 buy-ins normais (todos os jogadores) --
    const buyinTxs = [];
    P.forEach(j => {
        const r = addEntry(T, j.id, 'buyin');
        buyinTxs.push(r.tx);
    });

    // -- 2 buy-ins duplos (Carlos e Ana) --
    const buyinDuploTxs = [];
    // Carlos saiu cedo, faz buy-in duplo (re-entry como buyin_duplo)
    buyinDuploTxs.push(addEntry(T, P[0].id, 'buyin_duplo'));
    buyinDuploTxs.push(addEntry(T, P[1].id, 'buyin_duplo'));

    log.push('');
    log.push('═══════════════════════════════════════════');
    log.push('  FASE 2: RE-ENTRIES E REBUYS');
    log.push('═══════════════════════════════════════════');

    // -- 3 re-entries (Pedro, Marcos, Julia) --
    const reentryTxs = [];
    reentryTxs.push(addEntry(T, P[2].id, 'reentry'));
    reentryTxs.push(addEntry(T, P[3].id, 'reentry'));
    reentryTxs.push(addEntry(T, P[4].id, 'reentry'));

    // -- 2 rebuys duplos (Rafael e Fernanda) --
    const rebuyDuploTxs = [];
    rebuyDuploTxs.push(addEntry(T, P[5].id, 'rebuy_duplo'));
    rebuyDuploTxs.push(addEntry(T, P[6].id, 'rebuy_duplo'));

    // -- 1 rebuy simples (Bruno) --
    addEntry(T, P[7].id, 'rebuy_simples');

    log.push('');
    log.push('═══════════════════════════════════════════');
    log.push('  FASE 3: ADD-ONS E LAST CHANCE');
    log.push('═══════════════════════════════════════════');

    // -- 5 add-ons (Carlos, Ana, Pedro, Julia, Gabriel) --
    const addonTxs = [];
    [0,1,2,4,9].forEach(i => {
        addonTxs.push(addEntry(T, P[i].id, 'addon'));
    });

    // -- 2 last chances (Letícia e Gabriel) --
    addEntry(T, P[8].id, 'last_chance');
    addEntry(T, P[9].id, 'last_chance');

    // Limpa dedup entre fases (no app real, 3+ segundos se passam entre operações)
    _txDedupMap.clear();

    log.push('');
    log.push('═══════════════════════════════════════════');
    log.push('  FASE 4: DEPÓSITOS (CRÉDITOS)');
    log.push('═══════════════════════════════════════════');

    // -- Depósitos de saldo (crédito para jogadores) --
    const depTx1 = addDeposito(P[0].id, 100, 'pix');       // Carlos +100
    const depTx2 = addDeposito(P[3].id, 200, 'dinheiro');   // Marcos +200
    const depTx3 = addDeposito(P[7].id, 50, 'pix');         // Bruno +50

    _txDedupMap.clear();

    log.push('');
    log.push('═══════════════════════════════════════════');
    log.push('  FASE 5: ESTORNOS');
    log.push('═══════════════════════════════════════════');

    // -- Estorno do add-on do Carlos (erro de operador) --
    const carlosAddonTx = addonTxs[0].tx;
    const est1 = doEstorno(carlosAddonTx.id, 'Operador registrou add-on por engano');

    // -- Estorno de um re-entry do Pedro (jogador desistiu) --
    const pedroReentryTx = reentryTxs[0].tx;
    const est2 = doEstorno(pedroReentryTx.id, 'Jogador desistiu do re-entry');

    // -- Estorno do depósito do Bruno (valor errado) --
    const est3 = doEstorno(depTx3.id, 'Valor do depósito estava errado');

    // -- Tentar estornar o mesmo add-on do Carlos novamente (deve falhar) --
    log.push('');
    log.push('🔒 Teste: duplo estorno deve ser bloqueado...');
    const est4 = doEstorno(carlosAddonTx.id, 'Tentativa duplicada');

    // -- Tentar estornar o estorno (deve falhar) --
    if (est1.ok) {
        log.push('🔒 Teste: estorno de estorno deve ser bloqueado...');
        const est5 = doEstorno(est1.estorno.id, 'Tentativa de estornar estorno');
    }

    // Remover entries estornadas do torneio (simula o que o app faz)
    // Na prática o app marca a entry como removida, aqui simplificamos
    T.entries = T.entries.filter(e => {
        // Remove entry do Carlos addon e Pedro reentry
        if (carlosAddonTx && e.jogadorId === P[0].id && e.tipo === 'addon') {
            // Only remove first one (the estornado)
            const idx = T.entries.findIndex(x => x.id === e.id);
            if (idx >= 0 && T.entries[idx] === e) {
                return false; // remove
            }
        }
        return true;
    });
    // Better approach: track which entries were estornados
    const estornadoEntryCarlosAddon = T.entries.findIndex(e => e.jogadorId === P[0].id && e.tipo === 'addon');
    if (estornadoEntryCarlosAddon >= 0) T.entries.splice(estornadoEntryCarlosAddon, 1);
    const estornadoEntryPedroReentry = T.entries.findIndex(e => e.jogadorId === P[2].id && e.tipo === 'reentry');
    if (estornadoEntryPedroReentry >= 0) T.entries.splice(estornadoEntryPedroReentry, 1);

    _txDedupMap.clear();

    log.push('');
    log.push('═══════════════════════════════════════════');
    log.push('  FASE 6: PAGAMENTOS CASH (CLUBE → JOGADOR)');
    log.push('═══════════════════════════════════════════');

    // -- Carlos tem crédito (buy-in -150, buy-in duplo -300, depósito +100, addon estornado 0) = -350
    // -- Vamos depositar mais pra ele ter saldo positivo e então pagar
    addDeposito(P[0].id, 500, 'pix'); // Carlos agora: -350 + 500 = +150
    const saldoCarlosAntes = getSaldoJogador(P[0].id);
    log.push(`   Saldo Carlos antes do pagamento: ${formatMoney(saldoCarlosAntes)}`);
    addPagamentoCash(P[0].id, 150, 'pix'); // Paga tudo que ele tem

    // -- Marcos: buy-in -150, reentry -150, depósito +200 = -100
    // -- Vamos pagar R$ 50 dele (vai ficar devendo -150)
    addDeposito(P[3].id, 200, 'dinheiro'); // Marcos: -100 + 200 = +100
    addPagamentoCash(P[3].id, 100, 'dinheiro');

    // -- Ana: buy-in -150, buy-in duplo -300, addon -100 = -550
    // -- Deposita R$600 pra ter crédito e paga R$50
    addDeposito(P[1].id, 600, 'pix');  // Ana: -550 + 600 = +50
    addPagamentoCash(P[1].id, 50, 'pix');

    _txDedupMap.clear();

    log.push('');
    log.push('═══════════════════════════════════════════');
    log.push('  FASE 7: VALIDAÇÕES');
    log.push('═══════════════════════════════════════════');

    // ============================================================
    // TESTE 1: Saldo individual de cada jogador
    // ============================================================
    log.push('');
    log.push('--- Teste 1: Saldos individuais ---');

    // Carlos: buy-in(-150) + buyin_duplo(-300) + addon(-100→estornado:0) + dep(+100) + dep(+500) + pagamento(-150) = 0
    assertMoney('Carlos saldo final', getSaldoJogador(P[0].id), 0);

    // Ana: buy-in(-150) + buyin_duplo(-300) + addon(-100) + dep(+600) + pagamento(-50) = 0
    assertMoney('Ana saldo final', getSaldoJogador(P[1].id), 0);

    // Pedro: buy-in(-150) + reentry(-150→estornado:0) + addon(-100) = -250
    assertMoney('Pedro saldo final', getSaldoJogador(P[2].id), -250);

    // Marcos: buy-in(-150) + reentry(-150) + dep(+200) + dep(+200) + pagamento(-100) = 0
    assertMoney('Marcos saldo final', getSaldoJogador(P[3].id), 0);

    // Julia: buy-in(-150) + reentry(-150) + addon(-100) = -400
    assertMoney('Julia saldo final', getSaldoJogador(P[4].id), -400);

    // Rafael: buy-in(-150) + rebuy_duplo(-300) = -450
    assertMoney('Rafael saldo final', getSaldoJogador(P[5].id), -450);

    // Fernanda: buy-in(-150) + rebuy_duplo(-300) = -450
    assertMoney('Fernanda saldo final', getSaldoJogador(P[6].id), -450);

    // Bruno: buy-in(-150) + rebuy_simples(-150) + dep(+50→estornado:0) = -300
    assertMoney('Bruno saldo final', getSaldoJogador(P[7].id), -300);

    // Letícia: buy-in(-150) + last_chance(-80) = -230
    assertMoney('Letícia saldo final', getSaldoJogador(P[8].id), -230);

    // Gabriel: buy-in(-150) + addon(-100) + last_chance(-80) = -330
    assertMoney('Gabriel saldo final', getSaldoJogador(P[9].id), -330);

    // ============================================================
    // TESTE 2: Soma total de transações deve = 0 (sistema fechado)
    // ============================================================
    log.push('');
    log.push('--- Teste 2: Balanço geral do sistema ---');

    // Todas as transações originais + estornos + depósitos + pagamentos
    const somaTotal = transacoes.reduce((s, t) => s + t.valor, 0);
    // NÃO deve ser 0 porque depósitos e pagamentos criam valor (caixa do clube)
    // Mas: soma de TODOS os saldos dos jogadores = total movimentado
    const somaSaldos = P.reduce((s, j) => s + getSaldoJogador(j.id), 0);
    const somaSaldosCaixa = P.reduce((s, j) => s + getSaldoJogadorCaixaGeral(j.id), 0);

    log.push(`   Soma total de todas as transações: ${formatMoney(somaTotal)}`);
    log.push(`   Soma de saldos (todos jogadores): ${formatMoney(somaSaldos)}`);
    log.push(`   Soma de saldos caixa geral (sem cash): ${formatMoney(somaSaldosCaixa)}`);

    assertMoney('Soma transações = soma saldos', somaTotal, somaSaldos);

    // ============================================================
    // TESTE 3: Estornos cancelam corretamente
    // ============================================================
    log.push('');
    log.push('--- Teste 3: Estornos ---');

    // Para cada estorno, a soma original + estorno deve = 0
    const estornos = transacoes.filter(t => t.tipo === 'estorno');
    estornos.forEach(e => {
        const orig = transacoes.find(t => t.id === e.estornoRef);
        if (orig) {
            const soma = orig.valor + e.valor;
            assert(
                `Estorno cancela "${orig.descricao}"`,
                Math.abs(soma) < 0.01,
                `original ${formatMoney(orig.valor)} + estorno ${formatMoney(e.valor)} = ${formatMoney(soma)}`
            );
        }
    });

    assert('Duplo estorno foi bloqueado', !est4.ok, est4.erro);
    assert('Estorno de estorno bloqueado',
        transacoes.filter(t => t.tipo === 'estorno' && t.estornoRef === (est1.ok ? est1.estorno.id : '')).length === 0,
        'Nenhum estorno de estorno criado'
    );

    // ============================================================
    // TESTE 4: Cálculos do torneio (rake, prize, staff)
    // ============================================================
    log.push('');
    log.push('--- Teste 4: Cálculos do torneio ---');

    const brutoRake = _getBrutoParaRake(T);
    const brutoSemRake = _getBrutoSemRake(T);
    const rake = getRake(T);
    const staff = getStaff(T);
    const staffCascata = getStaffCascata(T);
    const staffFixo = getStaffFixo(T);
    const prize = getPrize(T);

    log.push(`   Entries no torneio: ${T.entries.length}`);
    log.push(`   Bruto para rake: ${formatMoney(brutoRake)}`);
    log.push(`   Bruto sem rake (last chance): ${formatMoney(brutoSemRake)}`);
    log.push(`   Rake (10%): ${formatMoney(rake)}`);
    log.push(`   Staff cascata (5%): ${formatMoney(staffCascata)}`);
    log.push(`   Staff fixo: ${formatMoney(staffFixo)}`);
    log.push(`   Prize pool: ${formatMoney(prize)}`);

    // Recalculate expected values manually:
    // Entries after estornos:
    // buy-in x10 = 10 × 150 = 1500
    // buyin_duplo x2 = 2 × 300 = 600
    // reentry x2 (Pedro estornado, sobram Marcos e Julia) = 2 × 150 = 300
    // rebuy_duplo x2 = 2 × 300 = 600
    // rebuy_simples x1 = 1 × 150 = 150
    // addon x4 (Carlos estornado, sobram Ana, Pedro, Julia, Gabriel) = 4 × 100 = 400
    // last_chance x2 = 2 × 80 = 160
    // Total entries (sem last_chance para rake): 1500+600+300+600+150+400 = 3550
    // Bruto para rake = 3550 (last_chance não paga rake)
    // Bruto sem rake = 160 (last chances)
    // Rake = 3550 × 10% = 355
    // Staff cascata = (3550 - 355) × 5% = 3195 × 5% = 159.75
    // Prize = (3550 - 355 - 159.75) + 160 = 3035.25 + 160 = 3195.25

    assertMoney('Bruto para rake', brutoRake, 3550);
    assertMoney('Bruto sem rake (last chance)', brutoSemRake, 160);
    assertMoney('Rake 10%', rake, 355);
    assertMoney('Staff cascata 5%', staffCascata, 159.75);
    assertMoney('Staff fixo = 0', staffFixo, 0);
    assertMoney('Prize pool', prize, 3195.25);

    // Prize + Rake + Staff = BrutoParaRake + BrutoSemRake (conservation)
    const totalDistribuido = prize + rake + staff;
    const totalArrecadado = brutoRake + brutoSemRake;
    assertMoney('Conservação: prize+rake+staff = bruto total', totalDistribuido, totalArrecadado);

    // ============================================================
    // TESTE 5: Integridade das transações de torneio vs entries
    // ============================================================
    log.push('');
    log.push('--- Teste 5: Integridade torneio ↔ transações ---');

    // Total cobrado dos jogadores em transações de torneio (excl. estornos e estornadas)
    const txsTorneio = transacoes.filter(t => t.origem === 'torneio' && t.tipo !== 'estorno' && !t.estornada);
    const totalCobradoTorneio = txsTorneio.reduce((s, t) => s + t.valor, 0); // negative
    const totalEntriesValor = T.entries.reduce((s, e) => s + e.valor, 0);

    assertMoney('Total cobrado torneio = total entries', Math.abs(totalCobradoTorneio), totalEntriesValor);

    // ============================================================
    // TESTE 6: Depósitos – pagamentos cash = fluxo caixa
    // ============================================================
    log.push('');
    log.push('--- Teste 6: Fluxo de caixa ---');

    const depositos = transacoes.filter(t => t.tipo === 'deposito' && !t.estornada);
    const pagamentos = transacoes.filter(t => t.tipo === 'pagamento_cash' && !t.estornada);
    const estornosDeDeposito = transacoes.filter(t => t.tipo === 'estorno' && t.origem === 'caixa');

    const totalDepositos = depositos.reduce((s, t) => s + t.valor, 0);
    const totalPagamentos = pagamentos.reduce((s, t) => s + t.valor, 0);
    const totalEstornosDeposito = estornosDeDeposito.reduce((s, t) => s + t.valor, 0);

    log.push(`   Total depósitos: ${formatMoney(totalDepositos)}`);
    log.push(`   Total pagamentos cash: ${formatMoney(totalPagamentos)} (negativo = saída)`);
    log.push(`   Total estornos de depósito: ${formatMoney(totalEstornosDeposito)}`);
    log.push(`   Fluxo caixa líquido: ${formatMoney(totalDepositos + totalPagamentos + totalEstornosDeposito)}`);

    // Depósitos até aqui: 100 + 200 + 50(estornado) + 500 + 200 + 600 = 1650
    // Não-estornados: 100 + 200 + 500 + 200 + 600 = 1600
    assertMoney('Total depósitos não-estornados', totalDepositos, 1600);
    // Pagamentos até aqui: Carlos 150 + Marcos 100 + Ana 50 = 300
    assertMoney('Total pagamentos cash', Math.abs(totalPagamentos), 300);

    // ============================================================
    // TESTE 7: getSaldoJogadorCaixaGeral exclui cash
    // ============================================================
    log.push('');
    log.push('--- Teste 7: Saldo caixa geral (exclui cash) ---');

    // Carlos caixa geral = buy-in(-150) + buyin_duplo(-300) + addon_estornado(0) + dep(+100) + dep(+500) = +150
    // (pagamento_cash é origem='cash', excluído)
    assertMoney('Carlos saldo caixa geral', getSaldoJogadorCaixaGeral(P[0].id), 150);

    // Ana caixa geral = buy-in(-150) + buyin_duplo(-300) + addon(-100) + dep(+600) = +50
    assertMoney('Ana saldo caixa geral', getSaldoJogadorCaixaGeral(P[1].id), 50);

    // ============================================================
    // TESTE 8: Dedup guard
    // ============================================================
    log.push('');
    log.push('--- Teste 8: Dedup guard ---');

    const beforeCount = transacoes.length;
    // Registrar mesma transação imediatamente (dentro de 2s window)
    const dupTx = registrarTransacao({
        jogadorId: P[0].id,
        tipo: 'deposito',
        valor: 500,
        descricao: 'Depósito duplicado',
        metodo: 'pix',
        origem: 'caixa',
    });
    // O dedup deve bloquear porque Carlos acabou de receber dep de 500 via pix
    // Mas nosso registrarTransacao usa timestamps sintéticos via nextTs, o dedup
    // compara com Date.now() real, então dependendo do timing pode ou não bloquear.
    // Vamos testar de forma controlável:
    _txDedupMap.set(`${P[0].id}|deposito|999`, Date.now()); // inject recent entry
    const dup2 = registrarTransacao({
        jogadorId: P[0].id,
        tipo: 'deposito',
        valor: 999,
        descricao: 'Dedup teste',
        metodo: 'pix',
        origem: 'caixa',
    });
    assert('Dedup bloqueia transação duplicada dentro da janela', dup2 === null, 'Transação duplicada retorna null');

    // Cleanup: remove any extra txs we created
    if (dupTx) {
        transacoes = transacoes.filter(t => t.id !== dupTx.id);
    }

    // ============================================================
    // TESTE 9: Pagamento Cash valida saldo
    // ============================================================
    log.push('');
    log.push('--- Teste 9: Pagamento cash — validação de saldo ---');

    // Pedro tem saldo -150 (devedor). Tentar pagar cash deve ser bloqueado
    const saldoPedro = getSaldoJogador(P[2].id);
    assert('Pedro é devedor (saldo negativo)', saldoPedro < 0, `Saldo: ${formatMoney(saldoPedro)}`);
    // A função confirmarPagamentoPositivo verifica saldoAtual <= 0
    assert('Sistema bloqueia pagamento a devedor', saldoPedro <= 0,
        'getSaldoJogador <= 0 → pagamento bloqueado pela validação');

    // Julia tem saldo -400. Depositar 500, pagar 100, saldo deve ser 0
    addDeposito(P[4].id, 500, 'pix');
    const saldoJuliaPos = getSaldoJogador(P[4].id);
    assert('Julia com crédito após depósito', saldoJuliaPos > 0, `Saldo: ${formatMoney(saldoJuliaPos)}`);
    addPagamentoCash(P[4].id, 100, 'dinheiro');
    assertMoney('Julia saldo após pagamento parcial', getSaldoJogador(P[4].id), 0);

    // ============================================================
    // TESTE 10: Consistência global final
    // ============================================================
    log.push('');
    log.push('--- Teste 10: Consistência global final ---');

    const somaFinal = transacoes.reduce((s, t) => s + t.valor, 0);
    const somaSaldosFinal = P.reduce((s, j) => s + getSaldoJogador(j.id), 0);
    assertMoney('Soma transações = soma saldos (final)', somaFinal, somaSaldosFinal);

    // Count estornos
    const totalEstornos = transacoes.filter(t => t.tipo === 'estorno').length;
    const totalEstornadas = transacoes.filter(t => t.estornada).length;
    assert('Cada estornada tem seu estorno', totalEstornos === totalEstornadas,
        `${totalEstornos} estornos, ${totalEstornadas} estornadas`);

    // Verify no orphan estornos
    const estornosOrfaos = transacoes.filter(t => t.tipo === 'estorno' && !transacoes.find(x => x.id === t.estornoRef));
    assert('Sem estornos órfãos', estornosOrfaos.length === 0,
        `${estornosOrfaos.length} estornos órfãos`);

    return { log, testResults, T };
}

// ========================================================================
// RENDERIZAÇÃO
// ========================================================================
function render() {
    const { log: logs, testResults: results, T } = runTest();
    const el = document.getElementById('results');

    const passed = results.filter(r => r.pass).length;
    const failed = results.filter(r => !r.pass).length;
    const total = results.length;

    let html = '';

    // --- Banner de resultado ---
    const allPass = failed === 0;
    html += `<div class="card" style="border-color: ${allPass ? 'var(--green)' : 'var(--red)'}; text-align:center;">
        <div style="font-size: 2.5rem;">${allPass ? '✅' : '❌'}</div>
        <div style="font-size: 1.3rem; font-weight: 800; color: ${allPass ? 'var(--green)' : 'var(--red)'}; margin:.3rem 0;">
            ${allPass ? 'TODOS OS TESTES PASSARAM' : `${failed} TESTE(S) FALHARAM`}
        </div>
        <div style="color: var(--muted); font-size:.85rem;">${passed}/${total} testes aprovados</div>
    </div>`;

    // --- Summary boxes ---
    const bruto = _getBrutoParaRake(T) + _getBrutoSemRake(T);
    html += `<div class="summary-box">
        <div class="stat"><div class="stat-label">Entries</div><div class="stat-value" style="color:var(--cyan)">${T.entries.length}</div></div>
        <div class="stat"><div class="stat-label">Bruto Total</div><div class="stat-value money">${formatMoney(bruto)}</div></div>
        <div class="stat"><div class="stat-label">Rake (10%)</div><div class="stat-value money">${formatMoney(getRake(T))}</div></div>
        <div class="stat"><div class="stat-label">Staff (5%)</div><div class="stat-value money">${formatMoney(getStaff(T))}</div></div>
        <div class="stat"><div class="stat-label">Prize Pool</div><div class="stat-value" style="color:var(--green)">${formatMoney(getPrize(T))}</div></div>
        <div class="stat"><div class="stat-label">Transações</div><div class="stat-value" style="color:var(--cyan)">${transacoes.length}</div></div>
    </div>`;

    // --- Resultados dos testes ---
    html += '<h2>📋 Resultados dos Testes</h2>';
    html += '<div class="card">';
    results.forEach(r => {
        html += `<div class="test-result">
            <span class="icon">${r.pass ? '✅' : '❌'}</span>
            <span class="${r.pass ? 'pass' : 'fail'}">${r.pass ? 'PASS' : 'FAIL'}</span>
            <span>${r.name}</span>
            ${r.detail ? `<span style="color:var(--muted);font-size:.75rem;margin-left:auto;">${r.detail}</span>` : ''}
        </div>`;
    });
    html += '</div>';

    // --- Breakdown do torneio ---
    html += '<h2>🏆 Breakdown do Torneio — Spartan 15k</h2>';
    html += '<div class="card">';

    // Count entries by type
    const entryCount = {};
    T.entries.forEach(e => { entryCount[e.tipo] = (entryCount[e.tipo] || 0) + 1; });
    html += '<h3>Composição das Entries</h3><table><tr><th>Tipo</th><th>Qtd</th><th>Valor Unit.</th><th>Subtotal</th></tr>';
    for (const [tipo, qtd] of Object.entries(entryCount)) {
        const valorUnit = T.entries.find(e => e.tipo === tipo)?.valor || 0;
        const badge = tipo.includes('buyin') ? 'badge-buyin' : tipo.includes('re') || tipo.includes('rebuy') ? 'badge-reentry' : tipo.includes('addon') ? 'badge-addon' : 'badge-deposito';
        html += `<tr>
            <td><span class="badge ${badge}">${tipo.replace(/_/g, ' ')}</span></td>
            <td>${qtd}</td>
            <td class="money">${formatMoney(valorUnit)}</td>
            <td class="money">${formatMoney(valorUnit * qtd)}</td>
        </tr>`;
    }
    html += '</table>';

    html += '<h3>Distribuição Financeira</h3>';
    const rake = getRake(T);
    const staff = getStaff(T);
    const prize = getPrize(T);
    const totalTorn = rake + staff + prize;
    html += `<table><tr><th>Item</th><th>Valor</th><th>%</th></tr>
        <tr><td>🏆 Prize Pool</td><td class="money" style="color:var(--green)">${formatMoney(prize)}</td><td>${(prize/totalTorn*100).toFixed(1)}%</td></tr>
        <tr><td>💰 Rake (Casa)</td><td class="money">${formatMoney(rake)}</td><td>${(rake/totalTorn*100).toFixed(1)}%</td></tr>
        <tr><td>👥 Staff</td><td class="money">${formatMoney(staff)}</td><td>${(staff/totalTorn*100).toFixed(1)}%</td></tr>
        <tr style="font-weight:800"><td>Total</td><td class="money">${formatMoney(totalTorn)}</td><td>100%</td></tr>
    </table>`;
    html += '</div>';

    // --- Saldos dos jogadores ---
    html += '<h2>👥 Saldos Finais dos Jogadores</h2>';
    html += '<div class="card"><table><tr><th>Jogador</th><th>Saldo Total</th><th>Saldo Caixa Geral</th><th>Status</th></tr>';
    JOGADORES.forEach(j => {
        const saldo = getSaldoJogador(j.id);
        const saldoCaixa = getSaldoJogadorCaixaGeral(j.id);
        const status = saldo > 0.01 ? '<span class="pos">Crédito</span>' :
                       saldo < -0.01 ? '<span class="neg">Devedor</span>' :
                       '<span class="pass">Zerado</span>';
        html += `<tr>
            <td>${j.nome}</td>
            <td class="money ${saldo >= 0 ? 'pos' : 'neg'}">${formatMoney(saldo)}</td>
            <td class="money ${saldoCaixa >= 0 ? 'pos' : 'neg'}">${formatMoney(saldoCaixa)}</td>
            <td>${status}</td>
        </tr>`;
    });
    html += '</table></div>';

    // --- Todas as transações ---
    html += '<h2>📄 Extrato Completo de Transações</h2>';
    html += '<div class="card"><table><tr><th>#</th><th>Jogador</th><th>Tipo</th><th>Valor</th><th>Descrição</th><th>Origem</th><th>Status</th></tr>';
    transacoes.forEach((t, i) => {
        const jog = JOGADORES.find(j => j.id === t.jogadorId);
        const badge = t.tipo === 'estorno' ? 'badge-estorno'
            : t.tipo === 'pagamento_cash' ? 'badge-pagamento'
            : t.tipo === 'deposito' ? 'badge-deposito'
            : t.tipo === 'buyin' ? 'badge-buyin'
            : t.tipo === 'reentry' ? 'badge-reentry'
            : t.tipo === 'addon' ? 'badge-addon'
            : 'badge-deposito';
        const status = t.estornada ? '<span class="warn">ESTORNADA</span>' : '';
        html += `<tr${t.estornada ? ' style="opacity:.5;text-decoration:line-through"' : ''}>
            <td style="color:var(--muted)">${i+1}</td>
            <td>${jog?.nome || '?'}</td>
            <td><span class="badge ${badge}">${t.tipo}</span></td>
            <td class="money ${t.valor >= 0 ? 'pos' : 'neg'}">${formatMoney(t.valor)}</td>
            <td style="font-size:.75rem;max-width:200px;overflow:hidden;text-overflow:ellipsis">${t.descricao || ''}</td>
            <td style="color:var(--muted)">${t.origem || '-'}</td>
            <td>${status}</td>
        </tr>`;
    });
    html += '</table></div>';

    // --- Log ---
    html += '<h2>📜 Log da Simulação</h2>';
    html += `<div class="log">${logs.join('\n')}</div>`;

    el.innerHTML = html;
}

// Run
render();
</script>
</body>
</html>
