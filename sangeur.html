<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#08070d" id="metaTema">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sangeur">
<link rel="manifest" href="/sangeur-manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon-sangeur.png">
<link rel="icon" type="image/png" href="/icons/icon-sangeur-192.png">
<title>StackSangeur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link id="fonteExtra" rel="stylesheet" href="">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    /* Padrão: preto e roxo do StackOS (o app recalcula tudo em aplicarTema) */
    --bg: #08070d; --bg2: #0e0c15; --card: #13111c; --line: #221d33; --line2: #2f2847;
    --tx: #f4f4f5; --tx2: #dcd8e6; --mut: #9a93b0; --mut2: #756e8a;
    --ac: #a855f7; --ac2: #d8b4fe; --acbg: #1d1430; --acln: #4c2f7a; --acdk: #ffffff;
    --grad: linear-gradient(135deg, #c06cff 0%, #5b5bff 100%);
    --warn: #fbbf24; --warnbg: #2a2110; --err: #fca5a5; --errbg: #2a1515; --errln: #5b2424;
    --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--tx);
    font-family: var(--ftx); overscroll-behavior: none;
    min-height: 100vh; min-height: 100dvh; }
  button, input { font-family: inherit; font-size: 16px; }
  button { cursor: pointer; border: none; background: none; color: inherit; }
  :root { --fnum: Manrope, system-ui, sans-serif; --ftx: Manrope, system-ui, -apple-system, sans-serif; }
  .mono { font-family: var(--fnum); font-variant-numeric: tabular-nums; font-weight: 800; letter-spacing: -.01em; }
  [hidden] { display: none !important; }

  /* LOGIN */
  #scr-login { min-height: 100dvh; display: flex; flex-direction: column; justify-content: center; gap: 22px;
    padding: calc(28px + var(--safe-t)) 22px calc(28px + var(--safe-b)); max-width: 440px; margin: 0 auto; }
  .brand { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
  .brand h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -.3px; }
  .brand p { margin: 0; color: var(--mut); font-size: 14px; }
  .form { display: flex; flex-direction: column; gap: 14px; background: var(--card); border: 1px solid var(--line);
    border-radius: 18px; padding: 20px; }
  .form label { display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 700; color: var(--mut);
    text-transform: uppercase; letter-spacing: .8px; }
  .inp { height: 50px; border-radius: 12px; border: 1px solid var(--line2); background: var(--bg2); color: var(--tx);
    padding: 0 14px; outline: none; text-transform: none; letter-spacing: 0; font-weight: 600; }
  .inp:focus { border-color: var(--ac); }
  .btn { height: 52px; border-radius: 14px; font-weight: 800; font-size: 16px; display: flex; align-items: center;
    justify-content: center; gap: 8px; }
  .btn-pri { background: var(--grad); color: var(--acdk); }
  .btn-pri:disabled { opacity: .45; }
  .btn-sec { border: 1px solid var(--line2); color: var(--tx2); }
  .erro { display: none; background: var(--errbg); border: 1px solid var(--errln); color: var(--err); border-radius: 12px;
    padding: 12px 14px; font-size: 14px; font-weight: 600; line-height: 1.4; }
  .erro.show { display: block; }
  .nota { margin: 0; font-size: 12.5px; color: var(--mut); line-height: 1.5; text-align: center; }
  .install { background: var(--bg2); border: 1px dashed var(--line2); border-radius: 14px; padding: 14px 16px;
    display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: var(--tx2); line-height: 1.45; }
  .install strong { color: var(--tx); }

  /* APP */
  #scr-app { min-height: 100dvh; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; }
  header.top { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: calc(14px + var(--safe-t)) 16px 12px;
    border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
  .top-row { display: flex; align-items: center; gap: 10px; }
  .top-row .who { flex: 1; min-width: 0; }
  .who .ola { font-size: 17px; font-weight: 800; }
  .who .tor { font-size: 12.5px; color: var(--mut); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip { font-size: 11.5px; font-weight: 800; border-radius: 999px; padding: 5px 10px; white-space: nowrap; }
  .chip-ac { background: var(--acbg); color: var(--ac2); border: 1px solid var(--acln); }
  .chip-warn { background: var(--warnbg); color: var(--warn); border: 1px solid #5c4515; }
  .chip-err { background: var(--errbg); color: var(--err); border: 1px solid var(--errln); }
  .chip-mut { background: var(--bg2); color: var(--mut); border: 1px solid var(--line2); }
  .offline { background: var(--warnbg); color: var(--warn); border: 1px solid #5c4515; border-radius: 10px; padding: 8px 12px;
    font-size: 12.5px; font-weight: 700; }
  .search { display: flex; align-items: center; gap: 10px; height: 50px; background: var(--card); border: 1px solid var(--line2);
    border-radius: 14px; padding: 0 14px; }
  .search input { flex: 1; min-width: 0; background: none; border: none; outline: none; color: var(--tx); font-weight: 600; }
  .tor-select { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
  .tor-select button { flex: 0 0 auto; height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line2);
    color: var(--tx2); font-size: 13px; font-weight: 700; }
  .tor-select button.on { background: var(--acbg); border-color: var(--acln); color: var(--ac2); }

  main { flex: 1; padding: 14px 16px calc(96px + var(--safe-b)); display: flex; flex-direction: column; gap: 10px; }
  .sec { font-size: 11.5px; font-weight: 800; color: var(--mut); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }
  .jog { display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 10px 12px; background: var(--card);
    border: 1px solid var(--line); border-radius: 14px; text-align: left; width: 100%; }
  .jog:active { border-color: var(--ac); }
  .av { flex: 0 0 auto; width: 42px; height: 42px; border-radius: 50%; background: var(--acbg); color: var(--ac2);
    display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; }
  .jog .nm { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .jog .nm b { font-size: 15.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .jog .nm span { font-size: 12.5px; color: var(--mut); }
  .badges { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
  .vazio { text-align: center; color: var(--mut); padding: 40px 12px; font-size: 14px; line-height: 1.5; }

  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--bg2); border-top: 1px solid var(--line);
    padding: 8px 12px calc(8px + var(--safe-b)); display: flex; gap: 8px; max-width: 560px; margin: 0 auto; }
  nav.tabs button { flex: 1; height: 50px; border-radius: 12px; font-weight: 800; font-size: 14px; color: var(--mut); }
  nav.tabs button.on { background: var(--acbg); color: var(--ac2); }

  /* SHEET JOGADOR */
  #sheet { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: flex; flex-direction: column;
    max-width: 560px; margin: 0 auto; }
  #sheet header { padding: calc(14px + var(--safe-t)) 16px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; }
  .voltar { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line2); display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
  #sheet .corpo { flex: 1; overflow-y: auto; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 10px; }
  .opc { display: flex; align-items: center; gap: 12px; min-height: 66px; padding: 12px 14px; border-radius: 14px;
    background: var(--card); border: 1.5px solid var(--line); text-align: left; width: 100%; }
  .opc .l { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .opc .l b { font-size: 16px; }
  .opc .l span { font-size: 12.5px; color: var(--mut); }
  .opc .v { font-size: 16px; font-weight: 700; color: var(--tx); }
  .opc.sel { border-color: var(--ac); background: var(--acbg); }
  .opc.sel .v { color: var(--ac2); }
  .opc:disabled { opacity: .5; }
  .opc:disabled .l span { color: var(--warn); }
  .qtd { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
  .qtd span { flex: 1; font-weight: 700; font-size: 14px; color: var(--tx2); }
  .qtd button { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line2); font-size: 22px; font-weight: 800; }
  .qtd output { min-width: 40px; text-align: center; font-size: 20px; font-weight: 700; }
  .pags { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .pags button { height: 48px; border-radius: 12px; border: 1.5px solid var(--line2); font-weight: 800; font-size: 14px; color: var(--tx2); }
  .pags button.sel { border-color: var(--ac); background: var(--acbg); color: var(--ac2); }
  .aviso { font-size: 13px; color: var(--tx2); background: var(--bg2); border: 1px solid var(--line2); border-radius: 12px; padding: 12px 14px; line-height: 1.45; }
  #sheet footer { padding: 12px 16px calc(12px + var(--safe-b)); border-top: 1px solid var(--line); background: var(--bg2); }

  /* PEDIDOS */
  .resumo { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .resumo div { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
  .resumo small { display: block; font-size: 11px; color: var(--mut); font-weight: 700; text-transform: uppercase; letter-spacing: .6px; }
  .resumo b { display: block; margin-top: 4px; font-size: 20px; }
  .ped { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .ped .r1 { display: flex; gap: 10px; align-items: flex-start; }
  .ped .r1 .l { flex: 1; min-width: 0; }
  .ped .r1 b { display: block; font-size: 15px; }
  .ped .r1 span { font-size: 12.5px; color: var(--mut); }
  .ped .mot { font-size: 13px; color: var(--err); background: var(--errbg); border-radius: 10px; padding: 8px 10px; }
  .ped .ok { font-size: 13px; color: var(--ac2); background: var(--acbg); border-radius: 10px; padding: 8px 10px; font-weight: 700; }
  .ped .acts { display: flex; gap: 8px; }
  .ped .acts button { height: 38px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--errln); color: var(--err); font-weight: 700; font-size: 13px; }

  #toast { position: fixed; left: 50%; bottom: calc(86px + var(--safe-b)); transform: translateX(-50%) translateY(20px); z-index: 40;
    background: var(--line); color: var(--tx); border: 1px solid var(--line2); border-radius: 12px; padding: 12px 16px; font-size: 14px;
    font-weight: 700; opacity: 0; transition: .2s; pointer-events: none; max-width: calc(100vw - 32px); text-align: center; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.ok { border-color: var(--acln); color: var(--ac2); }
  #toast.err { border-color: var(--errln); color: var(--err); }
  #loading { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; }
  #loading.show { display: flex; }
  .spin { width: 38px; height: 38px; border-radius: 50%; border: 3px solid var(--line2); border-top-color: var(--ac); animation: sp .8s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .ic-btn { width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--line2); display: flex; align-items: center; justify-content: center; color: var(--tx2); flex: 0 0 auto; }
  /* APARÊNCIA */
  #sheetTema { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.55); display: flex; align-items: flex-end; justify-content: center; }
  #sheetTema .box { width: 100%; max-width: 560px; max-height: 88dvh; overflow-y: auto; overscroll-behavior: contain; background: var(--bg2); border-top: 1px solid var(--line2); border-radius: 20px 20px 0 0;
    padding: 18px 16px calc(18px + var(--safe-b)); display: flex; flex-direction: column; gap: 14px; }
  .temas { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .tema { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 9px 6px; border-radius: 14px; border: 1.5px solid var(--line2); font-size: 12.5px; font-weight: 800; color: var(--tx2); }
  .tema i { width: 28px; height: 28px; border-radius: 50%; display: block; }
  .tema.sel { border-color: var(--ac); background: var(--acbg); color: var(--ac2); }
  .fontes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .fonte { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; padding: 8px 10px; border-radius: 12px; border: 1.5px solid var(--line2); color: var(--tx2); }
  .fonte b { font-size: 20px; font-variant-numeric: tabular-nums; }
  .fonte span { font-size: 11px; font-weight: 700; color: var(--mut); }
  .fonte.sel { border-color: var(--ac); background: var(--acbg); color: var(--ac2); }
  .lbl { font-size: 11.5px; font-weight: 800; color: var(--mut); text-transform: uppercase; letter-spacing: .8px; }
  .poc-barra { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; margin-top: 4px; }
  .poc-barra i { display: block; height: 100%; border-radius: 99px; background: var(--grad); }
  .poc-linha { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--tx2); }
  .poc-main .poc-linha b { font-size: 15px; color: var(--tx); }
  .poc-main .poc-linha span { font-size: 13px; }
  .mov .menos { color: var(--err); } .mov .mais { color: var(--ac2); }
  .cor-livre { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; border: 1px solid var(--line2); font-size: 14px; font-weight: 700; color: var(--tx2); }
  .cor-livre input { width: 46px; height: 34px; border: none; background: none; padding: 0; }
  /* POCHETE */
  .poc-main { background: var(--card); border: 1px solid var(--acln); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
  .poc-main small { font-size: 11.5px; font-weight: 800; color: var(--mut); text-transform: uppercase; letter-spacing: .8px; }
  .poc-main b { font-size: 34px; color: var(--tx); }
  .poc-main span { font-size: 13px; color: var(--mut); }
  .poc-dif { font-size: 13px; font-weight: 800; border-radius: 10px; padding: 8px 10px; }
  .poc-dif.ok { background: var(--acbg); color: var(--ac2); }
  .poc-dif.no { background: var(--errbg); color: var(--err); }
  .poc-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .poc-grid div { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
  .poc-grid small { display: block; font-size: 11px; color: var(--mut); font-weight: 700; text-transform: uppercase; letter-spacing: .6px; }
  .poc-grid b { display: block; margin-top: 4px; font-size: 19px; }
  .informar { display: flex; flex-direction: column; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
  .informar .row { display: flex; gap: 8px; }
  .informar .row .inp { flex: 1; min-width: 0; font-family: var(--fnum); font-size: 19px; font-variant-numeric: tabular-nums; }
  .atalhos { display: flex; gap: 6px; flex-wrap: wrap; }
  .atalhos button { height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line2); font-size: 13px; font-weight: 700; color: var(--tx2); }
  .mov { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--tx2); padding: 10px 12px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); }
  .mov span { color: var(--mut); font-size: 12px; }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<section id="scr-login" hidden>
  <div class="brand">
    <img src="/icons/icon-sangeur-192.png" width="76" height="76" alt="" style="border-radius:20px">
    <h1>StackSangeur</h1>
    <p>Fichas na mesa, direto do celular</p>
  </div>
  <form class="form" id="frmLogin" autocomplete="on">
    <label>E-mail <input class="inp" type="email" id="inpEmail" autocomplete="username" inputmode="email" required></label>
    <label>Senha <input class="inp" type="password" id="inpSenha" autocomplete="current-password" required></label>
    <div class="erro" id="erroLogin"></div>
    <button class="btn btn-pri" type="submit" id="btnLogin">Entrar</button>
    <p class="nota">Use o mesmo e-mail e senha do StackOS. Só entra quem tem a permissão <strong>Sangeur</strong>.</p>
  </form>
  <div class="install" id="boxInstall" hidden></div>
</section>

<!-- ============ APP ============ -->
<section id="scr-app" hidden>
  <header class="top">
    <div class="top-row">
      <div class="who">
        <div class="ola" id="hOla">Olá</div>
        <div class="tor" id="hTorneio">—</div>
      </div>
      <span class="chip chip-mut" id="hNivel">—</span>
      <button type="button" class="ic-btn" id="btnTema" aria-label="Aparência"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="13.5" cy="6.5" r="1.5"/><circle cx="17.5" cy="10.5" r="1.5"/><circle cx="8.5" cy="7.5" r="1.5"/><circle cx="6.5" cy="12.5" r="1.5"/><path d="M12 2a10 10 0 0 0 0 20c1.1 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.4-.5-.8-.5-1.3 0-1.1.9-2 2-2h2.4A5.6 5.6 0 0 0 22 9.8C22 5.5 17.5 2 12 2z"/></svg></button>
    </div>
    <div class="offline" id="hOffline" hidden>Sem internet. Os pedidos ficam guardados e são enviados quando a conexão voltar.</div>
    <div class="tor-select" id="torSelect" hidden></div>
    <label class="search" id="boxBusca">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="color:var(--mut)"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="search" id="inpBusca" placeholder="Buscar jogador pelo nome" autocomplete="off" enterkeyhint="search">
    </label>
  </header>

  <main id="tabJogadores"></main>
  <main id="tabPedidos" hidden></main>
  <main id="tabPochete" hidden></main>

  <nav class="tabs">
    <button type="button" class="on" data-tab="jogadores">Jogadores</button>
    <button type="button" data-tab="pedidos" id="tabBtnPedidos">Pedidos</button>
    <button type="button" data-tab="pochete">Pochete</button>
  </nav>
</section>

<!-- ============ JOGADOR ============ -->
<section id="sheet" hidden>
  <header>
    <button type="button" class="voltar" id="btnVoltar" aria-label="Voltar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true" style="color:var(--tx2)"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div style="flex:1;min-width:0">
      <div style="font-size:18px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" id="sNome">—</div>
      <div style="font-size:12.5px;color:var(--mut);margin-top:2px" id="sInfo">—</div>
    </div>
    <span id="sDeve"></span>
  </header>
  <div class="corpo" id="sCorpo"></div>
  <footer><button class="btn btn-pri" type="button" id="btnEnviar" style="width:100%" disabled>Escolha o pedido</button></footer>
</section>

<!-- ============ APARÊNCIA ============ -->
<section id="sheetTema" hidden>
  <div class="box" role="dialog" aria-label="Aparência">
    <div style="display:flex;align-items:center;gap:10px"><b style="flex:1;font-size:17px">Aparência</b><button type="button" class="ic-btn" id="btnTemaFechar" aria-label="Fechar">✕</button></div>
    <div class="atalhos" id="atalhosTema"><button type="button" data-ir="lblCor">Cor</button><button type="button" data-ir="lblFNum">Fonte dos números</button><button type="button" data-ir="lblFTx">Fonte do texto</button></div>
    <div class="lbl" id="lblCor">Cor</div>
    <div class="temas" id="listaTemas"></div>
    <label class="cor-livre"><input type="color" id="corLivre" value="#a855f7"> <span style="flex:1">Cor personalizada</span></label>
    <div class="lbl" id="lblFNum">Fonte dos números</div>
    <div class="fontes" id="listaFNum"></div>
    <div class="lbl" id="lblFTx">Fonte do texto</div>

  </div>
</section>

<div id="toast"></div>
<div id="loading"><div class="spin"></div></div>

<script>
'use strict';
// ============================================================
// StackSangeur — app da sangeur (celular).
// Só CRIA pedidos em sangeur_solicitacoes. Nada aqui lança entrada,
// mexe em transação ou em ficha: quem lança é o caixa, pelo StackOS,
// com o fluxo de lançamento de sempre.
// ============================================================
const SUPABASE_URL = 'https://jvvgdkjohfomuafsafsx.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_W8TlRO__dGOD539G6-9oFQ_aavbH2MA';
// Sessão própria (não divide o login com o StackOS/StackBar aberto no mesmo aparelho)
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { storageKey: 'stacksangeur-auth', persistSession: true, autoRefreshToken: true }
});
const $ = (id) => document.getElementById(id);
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (_) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} }
};

let SESS = null;           // retorno de sangeur_validar_acesso
let TORNEIOS = [];
let CLUBE_CFG = {};
let TORNEIO_ID = LS.get('stacksangeur_torneio', null);
let JOGADORES = [];
let PEDIDOS = [];
let FILA = LS.get('stacksangeur_fila', []);   // pedidos ainda não confirmados pelo servidor
let SEL = null;            // { jogador, tipo, qtd, pagto }
let _canal = null, _buscaTimer = null, _audio = null, _enviandoFila = false;
const _statusVisto = {};   // id → último status mostrado (pra avisar só na mudança)

const TIPO_NOME = { reentry: 'Reentrada', rebuy_simples: 'Rebuy simples', rebuy_duplo: 'Rebuy duplo', addon: 'Add-on', last_chance: 'Last Chance' };
const PAGTOS = [ ['dinheiro','Dinheiro'], ['pix','PIX'], ['debito','Débito'], ['credito','Crédito'], ['cheque','Cheque'] ];
const PAGTO_NOME = Object.fromEntries(PAGTOS);
const ERROS = {
  nao_logado: 'Sua sessão expirou. Entre de novo.',
  usuario_nao_encontrado: 'Usuário não encontrado no StackOS.',
  usuario_inativo: 'Seu usuário está inativo. Fale com o administrador.',
  app_nao_liberado: 'O StackSangeur ainda não está liberado para o seu clube.',
  sem_permissao: 'Seu usuário não tem a permissão Sangeur. Peça ao administrador para liberar.',
  torneio_invalido: 'Torneio não encontrado.',
  torneio_nao_ativo: 'Esse torneio não está mais em andamento.',
  jogador_invalido: 'Jogador não encontrado.',
  jogador_nao_inscrito: 'Esse jogador não está inscrito no torneio.',
  tipo_invalido: 'Tipo de pedido inválido.',
  acao_nao_permitida: 'Esse tipo de pedido não está liberado para a sangeur.',
  quantidade_invalida: 'Quantidade inválida.',
  forma_pagto_invalida: 'Forma de pagamento não aceita no app.',
  ja_tem_pendente: 'Esse jogador já tem um pedido aguardando o caixa.'
};

// ---------- helpers ----------
function esc(s) { return s == null ? '' : String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }
function money(v) { const n = Number(v) || 0; return 'R$ ' + n.toLocaleString('pt-BR', { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 }); }
function fichas(n) { n = Number(n) || 0; if (n >= 1000) return (n / 1000).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + 'K'; return String(n); }
function iniciais(nome) { const p = String(nome || '?').trim().split(/\s+/); return ((p[0] || '')[0] + ((p[1] || '')[0] || '')).toUpperCase(); }
function primeiroNome(n) { return String(n || '').trim().split(/\s+/)[0] || ''; }
function hora(iso) { try { return new Date(iso).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); } catch (_) { return ''; } }
function uuid() { return (crypto.randomUUID ? crypto.randomUUID() : 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2)); }
function toast(msg, kind) { const t = $('toast'); t.textContent = msg; t.className = kind || ''; void t.offsetWidth; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 3200); }
function loading(on) { $('loading').classList.toggle('show', !!on); }
function show(scr) { ['scr-login', 'scr-app'].forEach(id => { $(id).hidden = id !== scr; }); }
async function rpc(nome, args) {
  const { data, error } = await sb.rpc(nome, args || {});
  if (error) throw error;
  return data;
}

// ---------- som e vibração (aviso de aceite/recusa) ----------
function _initAudio() { try { if (!_audio) _audio = new (window.AudioContext || window.webkitAudioContext)(); if (_audio.state === 'suspended') _audio.resume(); } catch (_) {} }
document.addEventListener('pointerdown', _initAudio, { passive: true });
function bip(ok) {
  try { if (navigator.vibrate) navigator.vibrate(ok ? [120, 60, 120] : [300]); } catch (_) {}
  try {
    if (!_audio) return;
    const notas = ok ? [880, 1320] : [440, 330];
    notas.forEach((f, i) => {
      const o = _audio.createOscillator(), g = _audio.createGain();
      o.frequency.value = f; o.type = 'sine';
      g.gain.setValueAtTime(0.0001, _audio.currentTime + i * 0.16);
      g.gain.exponentialRampToValueAtTime(0.25, _audio.currentTime + i * 0.16 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, _audio.currentTime + i * 0.16 + 0.14);
      o.connect(g).connect(_audio.destination); o.start(_audio.currentTime + i * 0.16); o.stop(_audio.currentTime + i * 0.16 + 0.16);
    });
  } catch (_) {}
}

// ============================================================
// TRAVAS DO TORNEIO — cópia SÓ DE LEITURA das regras do StackOS
// (app.html: _tipoBloqueadoPorTrava e auxiliares). Serve só pra
// esconder/avisar no celular; quem valida de verdade é o caixa
// no lançamento de sempre.
// ============================================================
function _blinds(t) { return Array.isArray(t.blinds) ? t.blinds : []; }
function _ehBreak(b) { return !!(b && (b.isBreak || b.is_break)); }
function _ehBreakCompras(b) { return !!(b && _ehBreak(b) && (b.breakDeCompras === true || b.break_de_compras === true)); }
function nivelHumano(t) {
  const bl = _blinds(t), idx = Number(t.nivel_atual || 0); let n = 0;
  for (let i = 0; i <= idx; i++) if (bl[i] && !_ehBreak(bl[i])) n++;
  if (bl[idx] && _ehBreak(bl[idx])) return Math.max(1, n);
  return n || 1;
}
function temBreakCompras(t) { return _blinds(t).some(_ehBreakCompras); }
function emJanelaCompras(t) {
  if (t.compras_encerradas === true) return false;
  if (t.janela_compras_aberta_manual === true) return true;
  if (!t.is_break) return false;
  return _ehBreakCompras(_blinds(t)[Number(t.nivel_atual || 0)]);
}
function maxCompras(t) {
  if (Number(t.reentry_ate) > 0) return Number(t.reentry_ate);
  if (Number(CLUBE_CFG.cfg_nivel_max_compras) > 0) return Number(CLUBE_CFG.cfg_nivel_max_compras);
  return null;
}
function maxAddon() { return Number(CLUBE_CFG.cfg_nivel_max_addon) > 0 ? Number(CLUBE_CFG.cfg_nivel_max_addon) : null; }
function nivelAntesBreakCompras(t) {
  let j = 0; for (const b of _blinds(t)) { if (!b) continue; if (_ehBreakCompras(b)) return j; if (!_ehBreak(b)) j++; } return null;
}
function inicioLastChance(t) {
  const ma = maxAddon(); if (ma != null) return ma + 1;
  if (temBreakCompras(t)) { const n = nivelAntesBreakCompras(t); if (n != null) return n + 1; }
  const mc = maxCompras(t); if (mc != null) return mc + 1;
  return null;
}
function trava(t, tipo) {
  const iniciado = !!t.iniciado_em;
  if (tipo === 'addon') {
    if (temBreakCompras(t)) {
      if (!iniciado) return 'Add-on só no intervalo de compras';
      if (!emJanelaCompras(t)) { const n = nivelAntesBreakCompras(t); return n != null ? 'Add-on no intervalo (após o nível ' + n + ')' : 'Add-on só no intervalo de compras'; }
    }
    if (!iniciado) return 'Add-on só depois que o torneio começar';
  }
  if (!iniciado) return '';
  if (emJanelaCompras(t) && ['reentry', 'rebuy_simples', 'rebuy_duplo', 'addon'].includes(tipo)) return '';
  if (t.compras_encerradas === true && tipo !== 'last_chance') return 'Compras encerradas pelo caixa';
  const nv = nivelHumano(t);
  if (tipo === 'reentry') { const mx = maxCompras(t); if (mx != null && nv > mx) return 'Reentrada só até o nível ' + mx; }
  if (tipo === 'addon') {
    if (temBreakCompras(t)) { const n = nivelAntesBreakCompras(t); return n != null ? 'Add-on no intervalo (após o nível ' + n + ')' : 'Add-on só no intervalo de compras'; }
    const ma = maxAddon(); if (ma != null && nv > ma) return 'Add-on só até o nível ' + ma;
  }
  if (tipo === 'last_chance') {
    if (!t.last_chance_ativo) return 'Last Chance desligado neste torneio';
    const de = inicioLastChance(t); if (de != null && nv < de) return 'Last Chance a partir do nível ' + de;
    const ate = Number(t.last_chance_ate) > 0 ? Number(t.last_chance_ate) : null; if (ate != null && nv > ate) return 'Last Chance encerrou no nível ' + ate;
  }
  return '';
}
function rmMax(t) { if (['bounty', 'pko', 'knockout'].includes(t.tipo)) return 0; const m = Number(t.reentry_multiplo_max) || 0; return m > 1 ? m : 0; }
function valorReentry(t) { return (t.reentry_valor != null && !isNaN(Number(t.reentry_valor))) ? Number(t.reentry_valor) : (Number(t.buyin) || 0); }
function permitido(acao) { return Array.isArray(SESS?.config?.acoes_permitidas) && SESS.config.acoes_permitidas.includes(acao); }

// Opções que aparecem para o jogador (mesma lógica de "o que o caixa vê" no lançamento)
function opcoesJogador(t, j) {
  const ops = [], rm = rmMax(t);
  const podeReentry = Number(t.reentry_ate) > 0 && (j.eliminado || rm > 0);
  if (podeReentry && permitido('reentry')) {
    ops.push({ tipo: 'reentry', valor: valorReentry(t), fichas: Number(t.stack) || 0, maxQtd: permitido('reentry_multipla') ? Math.max(1, rm) : 1, trava: trava(t, 'reentry') });
  }
  if (!j.eliminado) {
    if (Number(t.rebuy_valor) > 0 && permitido('rebuy_simples')) ops.push({ tipo: 'rebuy_simples', valor: Number(t.rebuy_valor), fichas: Number(t.rebuy_fichas) || Number(t.stack) || 0, trava: trava(t, 'rebuy_simples') });
    if (Number(t.rebuy_duplo_valor) > 0 && permitido('rebuy_duplo')) ops.push({ tipo: 'rebuy_duplo', valor: Number(t.rebuy_duplo_valor), fichas: Number(t.rebuy_duplo_fichas) || (Number(t.stack) || 0) * 2, trava: trava(t, 'rebuy_duplo') });
    if (Number(t.addon_fichas) > 0 && permitido('addon')) ops.push({ tipo: 'addon', valor: Number(t.addon_valor) || 0, fichas: Number(t.addon_fichas) || 0, trava: (Number(j.addons) > 0 ? 'Já comprou add-on (1 por jogador)' : trava(t, 'addon')) });
    if (t.last_chance_ativo && (Number(t.last_chance_valor) > 0 || Number(t.last_chance_fichas) > 0) && permitido('last_chance')) ops.push({ tipo: 'last_chance', valor: Number(t.last_chance_valor) || 0, fichas: Number(t.last_chance_fichas) || 0, trava: trava(t, 'last_chance') });
  }
  return ops;
}

// ============================================================
// LOGIN
// ============================================================
async function validarEEntrar() {
  const d = await rpc('sangeur_validar_acesso');
  if (!d || !d.ok) {
    try { await sb.auth.signOut(); } catch (_) {}
    throw new Error(ERROS[d?.erro] || ('Acesso recusado (' + (d?.erro || 'desconhecido') + ')'));
  }
  SESS = d;
  aplicarTema();
  await entrarApp();
}

$('frmLogin').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const email = $('inpEmail').value.trim(), senha = $('inpSenha').value;
  const er = $('erroLogin'); er.classList.remove('show');
  if (!email || !senha) { er.textContent = 'Preencha e-mail e senha.'; er.classList.add('show'); return; }
  $('btnLogin').disabled = true; loading(true);
  try {
    const { error } = await sb.auth.signInWithPassword({ email, password: senha });
    if (error) throw new Error('E-mail ou senha incorretos.');
    await validarEEntrar();
  } catch (e) {
    er.textContent = e.message || 'Erro de conexão. Tente de novo.'; er.classList.add('show');
  } finally { loading(false); $('btnLogin').disabled = false; }
});

async function sair() {
  try { if (_canal) sb.removeChannel(_canal); } catch (_) {}
  try { await sb.auth.signOut(); } catch (_) {}
  SESS = null; show('scr-login');
}

// ============================================================
// APP
// ============================================================
async function entrarApp() {
  show('scr-app');
  $('hOla').textContent = 'Olá, ' + primeiroNome(SESS.user_nome);
  await carregarTorneios();
  await Promise.all([carregarJogadores(), carregarPedidos()]);
  assinarRealtime();
  enviarFila();
  carregarPochete();
}

async function carregarTorneios() {
  try {
    const d = await rpc('sangeur_listar_torneios');
    if (!d || !d.ok) { if (d?.erro === 'sem_permissao') { toast(ERROS.sem_permissao, 'err'); return sair(); } return; }
    TORNEIOS = d.torneios || []; CLUBE_CFG = d.clube || {};
    if (!TORNEIOS.some(t => t.id === TORNEIO_ID)) TORNEIO_ID = TORNEIOS[0]?.id || null;
    LS.set('stacksangeur_torneio', TORNEIO_ID);
    renderTopo();
  } catch (e) { console.warn('[sangeur] torneios', e); }
}
function abaAtual() { const b = document.querySelector('nav.tabs button.on'); return b ? b.dataset.tab : 'jogadores'; }
function torneioAtual() { return TORNEIOS.find(t => t.id === TORNEIO_ID) || null; }

function renderTopo() {
  const t = torneioAtual();
  const sel = $('torSelect');
  const naLista = abaAtual() === 'jogadores';
  sel.hidden = !naLista || TORNEIOS.length < 2;
  sel.innerHTML = TORNEIOS.map(x => '<button type="button" data-t="' + x.id + '" class="' + (x.id === TORNEIO_ID ? 'on' : '') + '">' + esc(x.nome) + '</button>').join('');
  $('boxBusca').hidden = !naLista || !t;
  if (!t) { $('hTorneio').textContent = 'Nenhum torneio em andamento'; $('hNivel').textContent = '—'; $('hNivel').className = 'chip chip-mut'; return; }
  $('hTorneio').textContent = t.nome;
  const nivel = 'Nível ' + nivelHumano(t);
  const ch = $('hNivel');
  if (t.status === 'paused') { ch.textContent = nivel + ' · pausado'; ch.className = 'chip chip-warn'; }
  else if (t.is_break) { ch.textContent = emJanelaCompras(t) ? 'Intervalo · compras abertas' : 'Intervalo'; ch.className = 'chip chip-warn'; }
  else { ch.textContent = nivel; ch.className = 'chip chip-ac'; }
}
$('torSelect').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-t]'); if (!b) return;
  TORNEIO_ID = b.dataset.t; LS.set('stacksangeur_torneio', TORNEIO_ID); renderTopo(); carregarJogadores();
});

async function carregarJogadores() {
  const t = torneioAtual(), main = $('tabJogadores');
  if (!t) { JOGADORES = []; main.innerHTML = '<div class="vazio">Nenhum torneio em andamento agora.<br>Quando o caixa iniciar um torneio, ele aparece aqui.</div>'; return; }
  try {
    const d = await rpc('sangeur_buscar_jogadores', { p_torneio_id: t.id, p_busca: $('inpBusca').value || '' });
    if (!d || !d.ok) return;
    JOGADORES = d.jogadores || [];
    renderJogadores();
  } catch (e) { console.warn('[sangeur] jogadores', e); }
}
function pendenteLocal(jid) { return FILA.some(f => f.args.p_jogador_id === jid && f.args.p_torneio_id === TORNEIO_ID); }
function renderJogadores() {
  const main = $('tabJogadores'), busca = ($('inpBusca').value || '').trim();
  if (!JOGADORES.length) { main.innerHTML = '<div class="vazio">' + (busca ? 'Nenhum inscrito com “' + esc(busca) + '”.' : 'Ninguém inscrito ainda.') + '</div>'; return; }
  main.innerHTML = '<div class="sec">' + (busca ? 'Resultado da busca' : 'Inscritos no torneio') + ' · ' + JOGADORES.length + '</div>' +
    JOGADORES.map(j => {
      const info = j.eliminado ? 'Eliminado · pode reentrar' : (Number(j.reentradas) > 0 ? j.reentradas + (j.reentradas == 1 ? ' reentrada' : ' reentradas') : 'Jogando');
      const pend = j.pendente || pendenteLocal(j.id);
      return '<button type="button" class="jog" data-j="' + j.id + '">' +
        '<span class="av">' + esc(iniciais(j.nome)) + '</span>' +
        '<span class="nm"><b>' + esc(j.nome) + (j.apelido ? ' <span style="color:var(--mut);font-weight:600">· ' + esc(j.apelido) + '</span>' : '') + '</b><span>' + info + '</span></span>' +
        '<span class="badges">' + (pend ? '<span class="chip chip-warn">pendente</span>' : '') + (j.deve ? '<span class="chip chip-err">deve</span>' : '') + '</span>' +
      '</button>';
    }).join('');
}
$('inpBusca').addEventListener('input', () => { clearTimeout(_buscaTimer); _buscaTimer = setTimeout(carregarJogadores, 250); });
$('tabJogadores').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-j]'); if (!b) return;
  const j = JOGADORES.find(x => x.id === b.dataset.j); if (j) abrirJogador(j);
});

// ---------- tela do jogador ----------
function abrirJogador(j) {
  const t = torneioAtual(); if (!t) return;
  SEL = { jogador: j, tipo: null, qtd: 1, pagto: null };
  $('sNome').textContent = j.nome;
  $('sInfo').textContent = j.eliminado ? 'Eliminado · ' + j.entradas + (j.entradas == 1 ? ' entrada' : ' entradas') : 'Jogando · ' + j.entradas + (j.entradas == 1 ? ' entrada' : ' entradas');
  $('sDeve').innerHTML = j.deve ? '<span class="chip chip-err">deve no clube</span>' : '<span class="chip chip-ac">sem débito</span>';
  $('sheet').hidden = false;
  history.pushState({ sheet: 1 }, '');
  renderSheet();
}
function fecharJogador() { $('sheet').hidden = true; SEL = null; }
$('btnVoltar').addEventListener('click', () => { if (history.state && history.state.sheet) history.back(); else fecharJogador(); });
window.addEventListener('popstate', () => { if (!$('sheet').hidden) fecharJogador(); });

function renderSheet() {
  const t = torneioAtual(), j = SEL.jogador, corpo = $('sCorpo');
  const pend = j.pendente || pendenteLocal(j.id);
  const ops = opcoesJogador(t, j);
  const pagModo = SESS.config?.pagamento_modo || 'sangeur_informa';
  let h = '';
  if (pend) h += '<div class="aviso" style="border-color:#5c4515;color:var(--warn)">Este jogador já tem um pedido aguardando o caixa. Espere o caixa resolver ou cancele em “Meus pedidos”.</div>';
  h += '<div class="sec">O que o jogador quer?</div>';
  if (!ops.length) h += '<div class="vazio" style="padding:20px 8px">' + (j.eliminado ? 'Reentrada não está disponível neste torneio.' : 'Nenhuma compra disponível para este jogador agora.') + '</div>';
  ops.forEach(o => {
    const sel = SEL.tipo === o.tipo, bloq = !!o.trava || pend;
    const q = (o.tipo === 'reentry' && sel) ? SEL.qtd : 1;
    const det = o.trava ? o.trava : (o.fichas ? fichas(o.fichas * q) + ' fichas' : '');
    h += '<button type="button" class="opc' + (sel ? ' sel' : '') + '" data-o="' + o.tipo + '"' + (bloq ? ' disabled' : '') + '>' +
      '<span class="l"><b>' + TIPO_NOME[o.tipo] + (q > 1 ? ' ' + q + 'x' : '') + '</b><span>' + esc(det) + '</span></span>' +
      '<span class="v mono">' + (o.valor > 0 ? money(o.valor * q) : 'Cortesia') + '</span></button>';
  });
  const op = ops.find(o => o.tipo === SEL.tipo);
  if (op && op.tipo === 'reentry' && op.maxQtd > 1) {
    h += '<div class="qtd"><span>Quantas reentradas?</span><button type="button" data-q="-1" aria-label="Menos">−</button><output class="mono">' + SEL.qtd + '</output><button type="button" data-q="1" aria-label="Mais">+</button></div>';
  }
  if (op && pagModo !== 'caixa' && op.valor > 0) {
    h += '<div class="sec">Como o jogador pagou?</div><div class="pags">' +
      PAGTOS.map(([k, n]) => '<button type="button" data-p="' + k + '" class="' + (SEL.pagto === k ? 'sel' : '') + '">' + n + '</button>').join('') +
      '</div><div style="font-size:12px;color:var(--mut)">Crédito no sistema só pelo caixa.</div>';
  }
  if (op) {
    const naHora = SESS.config?.entrega_modo === 'na_hora';
    h += '<div class="aviso">' + (naHora
      ? '<b>Pode entregar as fichas agora.</b> O caixa confirma o lançamento em seguida.'
      : '<b>Entregue as fichas só depois que o caixa aceitar.</b> O app avisa com som e vibração.') +
      (pagModo === 'caixa' ? '<br>O pagamento é acertado no caixa.' : '') + '</div>';
  }
  corpo.innerHTML = h;
  const btn = $('btnEnviar');
  const precisaPag = op && pagModo !== 'caixa' && op.valor > 0;
  btn.disabled = !op || !!op.trava || pend || (precisaPag && !SEL.pagto);

// ---------- fila (garante que nenhum pedido se perde se a internet cair) ----------
async function enviarItem(item) {

      const det = x.tipo === 'entrega' ? ' · ' + esc(primeiroNome(x.jogador)) + ' (' + (TIPO_NOME[x.pedido] || '') + (x.qtd > 1 ? ' ' + x.qtd + 'x' : '') + ')' + (x.pendente ? ' · aguardando caixa' : '') : (x.obs ? ' · ' + esc(x.obs) : '');
      const sn = SINAL[x.tipo] || ['', ''];
      return '<div class="mov"><div>' + NOME[x.tipo] + det + '<br><span>' + hora(x.em) + ((x.tipo === 'carga' || x.tipo === 'devolucao') && x.por ? ' · ' + esc(primeiroNome(x.por)) : '') + '</span></div><b class="mono ' + sn[1] + '">' + sn[0] + fichasN(x.quantidade) + '</b></div>';
    }).join('');
  }
  m.innerHTML = h;
  if (digitando != null) { const i = $('inpFichas'); i.value = digitando; i.focus(); }
}
function _lerFichas() { return parseInt(String($('inpFichas').value || '').replace(/\D/g, ''), 10) || 0; }
$('tabPochete').addEventListener('input', (e) => { if (e.target.id !== 'inpFichas') return; const n = _lerFichas(); e.target.value = n ? fichasN(n) : ''; });
$('tabPochete').addEventListener('click', async (e) => {
  const at = e.target.closest('button[data-soma]');
  if (at) { const v = Number(at.dataset.soma); const n = v ? _lerFichas() + v : 0; $('inpFichas').value = n ? fichasN(n) : ''; return; }
  if (!e.target.closest('#btnInformar')) return;
  const n = _lerFichas();
  if ($('inpFichas').value.trim() === '') { toast('Digite quantas fichas estão com você', 'err'); return; }
  const b = $('btnInformar'); b.disabled = true;
  try {
    const d = await rpc('sangeur_informar_fichas', { p_quantidade: n });
    if (!d || !d.ok) throw new Error(ERROS[d && d.erro] || 'erro');
    toast('Informado ao caixa: ' + fichasN(n) + ' fichas', 'ok');
    $('inpFichas').value = '';
    await carregarPochete(); renderPochete();
  } catch (err) { toast('Não foi possível enviar. Verifique a internet.', 'err'); }
  b.disabled = false;
});

// ---------- abas ----------
document.querySelector('nav.tabs').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-tab]'); if (!b) return;
  document.querySelectorAll('nav.tabs button').forEach(x => x.classList.toggle('on', x === b));
  const aba = b.dataset.tab;
  $('tabJogadores').hidden = aba !== 'jogadores'; $('tabPedidos').hidden = aba !== 'pedidos'; $('tabPochete').hidden = aba !== 'pochete';
  $('boxBusca').hidden = aba !== 'jogadores' || !torneioAtual(); $('torSelect').hidden = aba !== 'jogadores' || TORNEIOS.length < 2;
  if (aba === 'pedidos') carregarPedidos();
  if (aba === 'pochete') { renderPochete(); carregarPochete(); }
  window.scrollTo(0, 0);
});

// ---------- realtime + atualização periódica ----------
function assinarRealtime() {
  try { if (_canal) sb.removeChannel(_canal); } catch (_) {}
  _canal = sb.channel('sangeur_' + SESS.user_id)
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'sangeur_solicitacoes', filter: 'sangeur_id=eq.' + SESS.user_id }, () => { carregarPedidos(); carregarJogadores(); carregarPochete(); })
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'sangeur_fichas_mov', filter: 'sangeur_id=eq.' + SESS.user_id }, (pl) => {
      const n = pl && pl.new; if (n && n.tipo === 'carga') { bip(true); toast('Caixa registrou ' + fichasN(n.quantidade) + ' fichas para você', 'ok'); }
      else if (n && n.tipo === 'devolucao') toast('Caixa registrou devolução de ' + fichasN(n.quantidade) + ' fichas', '');
      carregarPochete(); })
    .subscribe();
}
// A cada minuto relê permissão e configuração (mudança no StackOS vale sem precisar sair e entrar)
let _ultimaValidacao = Date.now();
async function revalidar() {
  if (!SESS || Date.now() - _ultimaValidacao < 55000) return;
  _ultimaValidacao = Date.now();
  try {
    const d = await rpc('sangeur_validar_acesso');
    if (d && d.ok) { SESS.config = d.config; aplicarTema(); if (!$('sheet').hidden && SEL) renderSheet(); }
    else if (d && ['sem_permissao', 'app_nao_liberado', 'usuario_inativo'].includes(d.erro)) { toast(ERROS[d.erro], 'err'); sair(); }
  } catch (_) { /* sem rede: tenta no próximo ciclo */ }
}
setInterval(() => { if (!SESS || document.hidden) return; revalidar(); carregarTorneios().then(() => { if (!$('tabJogadores').hidden && $('sheet').hidden) carregarJogadores(); else if (!$('sheet').hidden) renderSheet(); }); carregarPedidos(); enviarFila(); if (!$('tabPochete').hidden) carregarPochete(); }, 20000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && SESS) { carregarTorneios(); carregarPedidos(); carregarJogadores(); enviarFila(); } });
function atualizaOnline() { $('hOffline').hidden = navigator.onLine; if (navigator.onLine) enviarFila(); }
window.addEventListener('online', atualizaOnline); window.addEventListener('offline', atualizaOnline);

// ---------- instalação no celular ----------
let _promptInstall = null;
function ehStandalone() { return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true; }
function ehIOS() { return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
function renderInstall() {
  const box = $('boxInstall');
  if (ehStandalone()) { box.hidden = true; return; }
  if (_promptInstall) {
    box.hidden = false;
    box.innerHTML = '<strong>Instale o app no celular</strong><span>Fica na tela inicial, abre em tela cheia e mantém o login.</span><button type="button" class="btn btn-pri" id="btnInstalar" style="height:46px;font-size:15px">Instalar StackSangeur</button>';
    $('btnInstalar').onclick = async () => { try { _promptInstall.prompt(); await _promptInstall.userChoice; } catch (_) {} _promptInstall = null; renderInstall(); };
  } else if (ehIOS()) {
    box.hidden = false;
    box.innerHTML = '<strong>Instalar no iPhone</strong><span>No Safari, toque em <b>Compartilhar</b> (quadrado com seta) e depois em <b>Adicionar à Tela de Início</b>.</span>';
  } else {
    box.hidden = false;
    box.innerHTML = '<strong>Instalar no Android</strong><span>No Chrome, abra o menu <b>⋮</b> e toque em <b>Instalar app</b> ou <b>Adicionar à tela inicial</b>.</span>';
  }
}
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); _promptInstall = e; renderInstall(); });
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sangeur-sw.js', { scope: '/sangeur' }).catch(() => {}); }

// ---------- início ----------
(async function boot() {
  aplicarTema(); atualizaOnline(); renderInstall();
  try {
    const { data } = await sb.auth.getSession();
    if (data && data.session) { loading(true); await validarEEntrar(); return; }
  } catch (e) {
    if (e && e.message && !/fetch|network/i.test(e.message)) { $('erroLogin').textContent = e.message; $('erroLogin').classList.add('show'); }
  } finally { loading(false); }
  show('scr-login');
})();
</script>
</body>
