<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07070a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Floor">
<link rel="manifest" href="/floor-manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon-floor.png">
<link rel="icon" type="image/png" href="/icons/icon-floor-192.png">
<title>StackFloor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#07070a;--p:#111114;--p2:#18181d;--line:#26262e;--fg:#ececf0;--mut:#9a9aa6;--dim:#5f5f6b;--acc:#a855f7;--acc-s:rgba(168,85,247,.18);--gold:#f5b53d;--gold-s:rgba(245,181,61,.12);--ok:#22c55e;--ok-s:rgba(34,197,94,.14);--bad:#f87171;--blu:#38bdf8;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 Manrope,system-ui,sans-serif;overscroll-behavior:none;height:100%}
button,input,select{font-family:inherit}
[hidden]{display:none!important}
.scr{position:fixed;inset:0;display:flex;flex-direction:column}
/* login */
#scr-login{justify-content:center;padding:24px 22px;gap:18px;max-width:440px;margin:0 auto}
#scr-login h1{margin:0;font-size:1.5rem}#scr-login p{margin:0;color:var(--mut);font-size:.85rem}
.in{width:100%;font-size:16px;background:var(--p);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:.8rem .9rem}
.btn{font:inherit;font-weight:800;font-size:.78rem;border-radius:11px;border:1px solid var(--line);background:var(--p2);color:var(--fg);padding:.6rem .85rem;cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn.gold{background:var(--gold);border-color:var(--gold);color:#1a1205}.btn.bad{color:var(--bad);border-color:rgba(248,113,113,.4);background:transparent}
.btn.big{width:100%;padding:.9rem;font-size:.95rem}
.erro{color:#fca5a5;font-size:.8rem;min-height:1em}
/* app */
.hdr{padding:calc(var(--safe-t) + 8px) 14px 10px;border-bottom:1px solid var(--line);background:#0b0b0e}
.hdr .t{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hdr b{font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:.62rem;font-weight:800;padding:.15rem .5rem;border-radius:99px;background:var(--ok-s);color:var(--ok);white-space:nowrap}
.pill.p{background:var(--gold-s);color:var(--gold)}
.stats{display:flex;gap:12px;margin-top:6px;font-size:.68rem;color:var(--mut);flex-wrap:wrap}.stats b{color:var(--fg);font-family:'Space Mono',monospace}
.trocar{font-size:.66rem;color:var(--acc);font-weight:800;background:none;border:0;padding:0;cursor:pointer}
.body{flex:1;overflow:auto;padding:12px 12px calc(84px + var(--safe-b));display:flex;flex-direction:column;gap:10px}
.body>*{flex-shrink:0}
.alert{border-radius:12px;padding:9px 11px;font-size:.74rem;line-height:1.4;display:flex;gap:8px;align-items:center}
.alert.w{background:var(--gold-s);border:1px solid rgba(245,181,61,.35);color:#fde68a}
.alert.i{background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.3);color:#bae6fd}
.alert .btn{margin-left:auto;flex-shrink:0;padding:.45rem .7rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{background:var(--p);border:1px solid var(--line);border-radius:14px;padding:8px;cursor:pointer;text-align:left;font:inherit;color:var(--fg)}
.mini .mh{display:flex;justify-content:space-between;font-size:.74rem;font-weight:800;margin-bottom:2px}.mini .mh span{font-family:'Space Mono',monospace;color:var(--mut);font-size:.66rem}
.mini.cheia .mh span{color:var(--gold)}.mini.curta .mh span{color:var(--blu)}
.tbl{position:relative;width:100%}
.tbl.mn{aspect-ratio:1.6/1}.tbl.gr{aspect-ratio:1/1.3;margin-top:4px}
.felt{position:absolute;border-radius:999px;background:radial-gradient(ellipse at 50% 45%,#16774a,#0f5132 55%,#0a3a24);border:7px solid #3b2414;box-shadow:inset 0 0 0 2px rgba(255,255,255,.06),0 10px 30px rgba(0,0,0,.5)}
.tbl.mn .felt{left:10%;right:10%;top:16%;bottom:16%;border-width:4px}
.tbl.gr .felt{left:19%;right:19%;top:11%;bottom:11%}
.logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:rgba(255,255,255,.35);font-weight:800;letter-spacing:.12em;font-size:.6rem;pointer-events:none}
.logo b{display:block;font-size:1.3rem;color:rgba(255,255,255,.55);letter-spacing:.03em}
.dl{position:absolute;transform:translate(-50%,-50%);font-size:.55rem;font-weight:800;background:#fff;color:#111;border-radius:6px;padding:2px 6px}
.ms{position:absolute;transform:translate(-50%,-50%);width:14px;height:14px;border-radius:50%;background:var(--acc);border:1.5px solid #c084fc}
.ms.l{background:transparent;border:1.5px dashed rgba(34,197,94,.6)}
.st{position:absolute;transform:translate(-50%,-50%);width:76px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;border:0;background:none;font:inherit;color:var(--fg);padding:0;touch-action:none}
.st .av{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;background:#25252d;border:2px solid #3a3a46;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.st .nm{font-size:.62rem;font-weight:800;max-width:76px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:rgba(10,10,14,.85);border-radius:5px;padding:1px 5px}
.st .no{font-size:.5rem;color:var(--mut);font-weight:800}
.st.livre .av{background:transparent;border:2px dashed rgba(34,197,94,.55);color:var(--ok);font-size:1.05rem}
.st.livre .nm{color:var(--ok);background:transparent}
.st.sel .av{border-color:var(--acc);box-shadow:0 0 0 4px rgba(168,85,247,.35)}
.st.alvo .av{border-color:var(--ok);box-shadow:0 0 0 4px rgba(34,197,94,.35);animation:pul 1s infinite}
.st.drop .av{background:var(--ok-s);transform:scale(1.12)}
@keyframes pul{50%{box-shadow:0 0 0 7px rgba(34,197,94,.15)}}
.bar{display:flex;align-items:center;gap:8px}.bar .sp{flex:1}.bar b{font-size:1rem}
.tray{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{flex-shrink:0;display:flex;align-items:center;gap:6px;background:var(--p2);border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 4px;font-size:.72rem;font-weight:800;cursor:grab;touch-action:none;user-select:none}
.chip i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--acc-s);color:#e9d5ff;display:flex;align-items:center;justify-content:center;font-size:.62rem}
.chip.on{border-color:var(--acc);background:var(--acc-s)}
.ghost{position:fixed;z-index:100;pointer-events:none;background:var(--acc);color:#fff;font-weight:800;font-size:.74rem;border-radius:999px;padding:7px 13px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.nav{position:fixed;left:0;right:0;bottom:0;height:calc(64px + var(--safe-b));padding-bottom:var(--safe-b);background:#0d0d11;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:3}
.nav button{font:inherit;background:none;border:0;color:var(--dim);font-size:.64rem;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
.nav button i{font-style:normal;font-size:1.15rem}.nav button.on{color:var(--acc)}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#121217;border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:14px 14px calc(22px + var(--safe-b));transform:translateY(105%);transition:transform .2s;z-index:6;display:flex;flex-direction:column;gap:8px;max-height:80vh;overflow:auto}
.sheet.on{transform:none}.sheet .grab{width:40px;height:4px;border-radius:4px;background:#333;margin:0 auto 4px}
.sheet h3{margin:0;font-size:1rem}.sheet .sub{font-size:.72rem;color:var(--mut)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}.acts .btn{padding:.85rem .5rem;font-size:.82rem}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:5;display:none}.shade.on{display:block}
.toast{position:fixed;left:12px;right:12px;top:calc(var(--safe-t) + 74px);background:#1f1f27;border:1px solid #3a3a46;border-radius:12px;padding:10px 12px;font-size:.78rem;font-weight:700;z-index:8;opacity:0;transform:translateY(-10px);transition:.2s;pointer-events:none}
.toast.on{opacity:1;transform:none}
.mv{display:flex;flex-direction:column;gap:6px}
.mv .row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.78rem;background:var(--p2);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.mv .row b{font-family:'Space Mono',monospace;font-size:.7rem;color:var(--ok);white-space:nowrap}
.lista .row{cursor:pointer}
.note{font-size:.74rem;color:var(--mut);line-height:1.45}
.vazio{text-align:center;color:var(--mut);font-size:.82rem;padding:30px 10px}
.off{position:fixed;top:calc(var(--safe-t) + 4px);left:50%;transform:translateX(-50%);background:#7f1d1d;color:#fecaca;font-size:.68rem;font-weight:800;padding:3px 10px;border-radius:99px;z-index:9}
.inst{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;padding:12px 12px calc(12px + var(--safe-b))}
.inst .cx{width:100%;max-width:440px;background:#131318;border:1px solid #2f2f38;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
.inst .ic{display:flex;gap:12px;align-items:center}.inst .ic img{width:56px;height:56px;border-radius:14px}
.inst h3{margin:0;font-size:1.05rem}.inst p{margin:0;font-size:.82rem;color:var(--mut);line-height:1.5}
.inst ol{margin:0;padding-left:1.2rem;font-size:.86rem;line-height:1.9}.inst ol b{color:#fff}
.inst .shr{display:inline-flex;vertical-align:-4px;width:20px;height:20px}
.boxinst{background:var(--p);border:1px dashed #3a3a46;border-radius:12px;padding:10px 12px;font-size:.78rem;color:var(--mut);display:flex;gap:10px;align-items:center}
.boxinst .btn{margin-left:auto;flex-shrink:0}
.tcard{background:var(--p);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<div class="off" id="off" hidden>Sem conexão</div>

<!-- LOGIN -->
<div class="scr" id="scr-login" hidden>
  <div><h1>🃏 StackFloor</h1><p>Mesas e lugares dos torneios, em tempo real.</p></div>
  <form id="frmLogin" style="display:flex;flex-direction:column;gap:12px">
    <input class="in" id="inpEmail" type="email" autocomplete="username" placeholder="E-mail">
    <input class="in" id="inpSenha" type="password" autocomplete="current-password" placeholder="Senha">
    <div class="erro" id="erroLogin"></div>
    <button class="btn pri big" id="btnLogin" type="submit">Entrar</button>
  </form>
  <div class="boxinst" id="boxInst" hidden><span>📲 Instale o StackFloor na tela inicial do celular.</span><button class="btn pri" type="button" onclick="mostrarInstalar(true)">Como instalar</button></div>
  <p style="font-size:.72rem">Use o mesmo login do StackOS. O administrador do clube libera o acesso em Torneio → Mesas → ⚙.</p>
</div>

<!-- ESCOLHER TORNEIO -->
<div class="scr" id="scr-torneios" hidden>
  <div class="hdr"><div class="t"><b id="tClube">Torneios</b><button class="trocar" onclick="sair()">Sair</button></div></div>
  <div class="body" id="listaT"></div>
</div>

<!-- APP -->
<div class="scr" id="scr-app" hidden>
  <div class="hdr"><div class="t"><b id="hNome">—</b><span class="pill" id="hStatus">—</span></div>
    <div class="stats"><span>Ativos <b id="sAt">0</b></span><span>Mesas <b id="sMs">0</b></span><span>Livres <b id="sLv">0</b></span><span>Sem lugar <b id="sSl">0</b></span><span style="margin-left:auto"><button class="trocar" onclick="trocarTorneio()">Trocar torneio</button></span></div></div>
  <div class="body" id="body"></div>
  <div class="nav"><button class="on" data-v="mesas"><i>⬭</i>Mesas</button><button data-v="busca"><i>🔎</i>Jogadores</button><button data-v="mais"><i>☰</i>Mais</button><button data-v="log"><i>🕘</i>Histórico</button></div>
</div>
<div class="shade" id="shade"></div><div class="sheet" id="sheet"></div><div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://jvvgdkjohfomuafsafsx.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_W8TlRO__dGOD539G6-9oFQ_aavbH2MA';
// Sessão própria (não divide o login com o StackOS aberto no mesmo aparelho)
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { storageKey: 'stackfloor-auth', persistSession: true, autoRefreshToken: true } });
const $ = (id) => document.getElementById(id);
const LS = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (_) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} } };
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ini = (n) => String(n || '?').trim().split(/\s+/).map(p => p[0]).slice(0, 2).join('').toUpperCase();
const ERROS = { nao_logado: 'Faça login.', sem_permissao: 'Seu usuário não tem acesso ao app do floor. Peça ao administrador para liberar em Torneio → Mesas → ⚙.' };
const MSG = { ocupada: 'Essa cadeira acabou de ser ocupada.', mudou: 'Alguém mudou esse lugar agora há pouco.', cadeira_invalida: 'Cadeira inválida.', mesa_com_jogadores: 'Ainda tem jogador nessa mesa.' };

let SESS = null, TID = LS.get('stackfloor_torneio', null), D = null, view = 'mesas', aberta = null, sel = null, modo = null, pegou = null, canal = null, _ref = null;

async function rpc(nome, args) { const { data, error } = await sb.rpc(nome, args || {}); if (error) throw error; return data; }
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 2600); try { navigator.vibrate && navigator.vibrate(15); } catch (_) {} }
function show(id) { ['scr-login', 'scr-torneios', 'scr-app'].forEach(s => $(s).hidden = s !== id); }

// ─── login ───
$('frmLogin').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const email = $('inpEmail').value.trim(), senha = $('inpSenha').value, er = $('erroLogin'); er.textContent = '';
  if (!email || !senha) { er.textContent = 'Preencha e-mail e senha.'; return; }
  $('btnLogin').disabled = true;
  try {
    const { error } = await sb.auth.signInWithPassword({ email, password: senha });
    if (error) throw new Error('E-mail ou senha incorretos.');
    await validar();
  } catch (e) { er.textContent = e.message || 'Erro de conexão.'; }
  finally { $('btnLogin').disabled = false; }
});
async function validar() {
  const d = await rpc('floor_validar_acesso');
  if (!d || !d.ok) { try { await sb.auth.signOut(); } catch (_) {} throw new Error(ERROS[d && d.erro] || 'Acesso recusado.'); }
  SESS = d;
  await listarTorneios(true);
}
async function sair() { try { if (canal) sb.removeChannel(canal); } catch (_) {} try { await sb.auth.signOut(); } catch (_) {} SESS = null; show('scr-login'); }

// ─── torneios ───
async function listarTorneios(auto) {
  const d = await rpc('floor_torneios');
  const ts = (d && d.torneios) || [];
  $('tClube').textContent = SESS.clube_nome || 'Torneios';
  if (auto && TID && ts.some(t => t.id === TID)) return abrirTorneio(TID);
  if (auto && ts.length === 1) return abrirTorneio(ts[0].id);
  show('scr-torneios');
  $('listaT').innerHTML = `<div class="note">Olá, ${esc((SESS.user_nome || '').split(' ')[0])}. Escolha o torneio:</div>` +
    (ts.length ? ts.map(t => `<div class="tcard" onclick="abrirTorneio('${t.id}')"><b>${esc(t.nome)}</b><span class="pill ${t.status === 'running' ? '' : 'p'}">${stTxt(t)}</span></div>`).join('') : '<div class="vazio">Nenhum torneio aberto agora.<br><br><button class="btn" onclick="listarTorneios()">Atualizar</button></div>');
}
const stTxt = (t) => t.is_break ? 'Intervalo' : ({ running: 'Rodando', paused: 'Pausado', waiting: 'Aguardando', break: 'Intervalo' }[t.status] || t.status);
function trocarTorneio() { TID = null; LS.set('stackfloor_torneio', null); try { if (canal) sb.removeChannel(canal); } catch (_) {} canal = null; listarTorneios(false); }
async function abrirTorneio(id) {
  TID = id; LS.set('stackfloor_torneio', id); aberta = null; sel = null; modo = null; pegou = null; view = 'mesas';
  document.querySelectorAll('.nav button').forEach(x => x.classList.toggle('on', x.dataset.v === 'mesas'));
  show('scr-app');
  $('body').innerHTML = '<div class="vazio">Carregando…</div>';
  await recarregar();
  assinar();
}

// ─── dados ───
async function recarregar() {
  try {
    const d = await rpc('floor_estado', { p_torneio: TID });
    if (!d || !d.ok) { toast(ERROS[d && d.erro] || 'Não foi possível abrir o torneio'); return trocarTorneio(); }
    D = d; $('off').hidden = true;
    if (!modo && !pegou && !$('sheet').classList.contains('on') && !document.body.classList.contains('arrastando')) render();
    else stats();
  } catch (e) { console.warn(e); $('off').hidden = false; }
}
function agendar() { clearTimeout(_ref); _ref = setTimeout(recarregar, 350); }
function assinar() {
  try { if (canal) sb.removeChannel(canal); } catch (_) {}
  const f = 'torneio_id=eq.' + TID;
  canal = sb.channel('floor:' + TID);
  ['torneio_lugares', 'torneio_mesas_estado', 'torneio_entries', 'torneio_eliminados', 'floor_pedidos'].forEach(tb => canal.on('postgres_changes', { event: '*', schema: 'public', table: tb, filter: f }, agendar));
  canal.on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'torneios', filter: 'id=eq.' + TID }, agendar);
  canal.subscribe();
}
setInterval(() => { if (TID && SESS && document.visibilityState === 'visible') recarregar(); }, 20000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && TID && SESS) recarregar(); });
window.addEventListener('online', () => { if (TID && SESS) recarregar(); });

// ─── modelo ───
function M() {
  const cad = Number(D.estado.cadeiras) || Number(D.cfg.cadeiras) || 9;
  const nomes = new Map(D.ativos.map(a => [a.id, a]));
  const porMesa = new Map(), fora = [], sentados = new Set(), comLugar = new Set();
  D.lugares.forEach(l => {
    if (!nomes.has(l.j)) return;
    comLugar.add(l.j);
    if (l.status === 'sentado') { if (!porMesa.has(l.m)) porMesa.set(l.m, new Array(cad).fill(null)); const a = porMesa.get(l.m); if (l.c >= 1 && l.c <= cad) a[l.c - 1] = l.j; sentados.add(l.j); }
    else fora.push(l.j);
  });
  const nums = new Set([...(D.estado.abertas || []), ...porMesa.keys()]);
  const mesas = [...nums].sort((a, b) => a - b).map(n => ({ n, s: porMesa.get(n) || new Array(cad).fill(null) }));
  const semLugar = D.ativos.filter(a => !comLugar.has(a.id)).map(a => a.id);
  return { cad, mesas, fora, semLugar, sentados, nomes };
}
const nome = (j) => { const a = D && D.ativos.find(x => x.id === j); return a ? a.nome : 'Jogador'; };
const ocup = (m) => m.s.filter(Boolean).length;
function pos(i, n, mini) { const a = Math.PI / 2 + (i + 1) * 2 * Math.PI / (n + 1); return mini ? [50 + 44 * Math.cos(a), 50 + 40 * Math.sin(a)] : [50 + 39 * Math.cos(a), 50 + 43 * Math.sin(a)]; }

function sugBal(m) {
  const ms = m.mesas.filter(x => ocup(x)).map(x => ({ n: x.n, s: x.s.slice() })); if (ms.length < 2) return [];
  const movs = [], foi = new Set();
  for (let k = 0; k < 200; k++) {
    ms.sort((a, b) => ocup(b) - ocup(a)); const mx = ms[0], mn = ms[ms.length - 1];
    if (ocup(mx) - ocup(mn) < 2) break;
    const cs = mx.s.map((j, i) => [j, i]).filter(x => x[0] && !foi.has(x[0])), lv = mn.s.map((j, i) => [j, i]).filter(x => !x[0]);
    if (!cs.length || !lv.length) break;

  try {
    const { data } = await sb.auth.getSession();
    if (data && data.session) { await validar(); return; }
  } catch (e) { console.warn(e); }
  show('scr-login');
})().catch(e => { $('erroLogin').textContent = e.message || ''; show('scr-login'); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/floor-sw.js', { scope: '/floor' }).catch(() => {});

// ─── sugestão de instalar o app (Android: botão de instalar · iPhone: passo a passo) ───
let _promptInst = null;
const ehStandalone = () => window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
const ehIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const ehAndroid = () => /android/i.test(navigator.userAgent);
const ehSafariIOS = () => ehIOS() && !/crios|fxios|edgios|opios|gsa\//i.test(navigator.userAgent);
const ehCelular = () => ehIOS() || ehAndroid();
const SHARE_SVG = '<svg class="shr" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M5 11v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8"/></svg>';
function mostrarInstalar(forcar) {
  if (ehStandalone()) return;
  if (!forcar) { const ate = LS.get('stackfloor_inst_adiado', 0); if (Date.now() < ate || !ehCelular()) return; }
  if (document.getElementById('inst')) return;
  let corpo;
  if (_promptInst) corpo = `<p>Fica na tela inicial, abre em tela cheia e mantém o login.</p><button class="btn pri big" id="btnInst">📲 Instalar StackFloor</button>`;
  else if (ehIOS() && !ehSafariIOS()) corpo = `<p>No iPhone, a instalação é feita pelo <b>Safari</b>. Copie o endereço e abra no Safari:</p><p style="color:#fff;font-weight:800;user-select:all">${location.origin}/floor</p><button class="btn big" id="btnCopiar">Copiar endereço</button>`;
  else if (ehIOS()) corpo = `<ol><li>Toque em <b>Compartilhar</b> ${SHARE_SVG} na barra do Safari</li><li>Role e toque em <b>Adicionar à Tela de Início</b></li><li>Toque em <b>Adicionar</b></li></ol><p>O ícone do StackFloor aparece na tela inicial.</p>`;
  else corpo = `<ol><li>Toque no menu <b>⋮</b> do Chrome (canto de cima)</li><li>Toque em <b>Instalar app</b> ou <b>Adicionar à tela inicial</b></li><li>Confirme em <b>Instalar</b></li></ol>`;
  const ov = document.createElement('div'); ov.className = 'inst'; ov.id = 'inst';
  ov.innerHTML = `<div class="cx"><div class="ic"><img src="/icons/icon-floor-192.png" alt=""><div><h3>Instale o StackFloor</h3><p>App do floor: mesas e lugares em tempo real</p></div></div>${corpo}<button class="btn" id="btnDepois">Agora não</button></div>`;
  document.body.appendChild(ov);
  const fecharInst = () => { ov.remove(); LS.set('stackfloor_inst_adiado', Date.now() + 3 * 86400000); };
  ov.querySelector('#btnDepois').onclick = fecharInst;
  ov.addEventListener('click', (e) => { if (e.target === ov) fecharInst(); });
  const bi = ov.querySelector('#btnInst');
  if (bi) bi.onclick = async () => { try { _promptInst.prompt(); const r = await _promptInst.userChoice; if (r && r.outcome === 'accepted') toast('✅ StackFloor instalado'); } catch (_) {} _promptInst = null; ov.remove(); renderBoxInst(); };
  const bc = ov.querySelector('#btnCopiar');
  if (bc) bc.onclick = async () => { try { await navigator.clipboard.writeText(location.origin + '/floor'); toast('Endereço copiado: cole no Safari'); } catch (_) { toast('Copie o endereço acima'); } };
}
function renderBoxInst() { const b = $('boxInst'); if (b) b.hidden = ehStandalone(); }
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); _promptInst = e; renderBoxInst(); const o = document.getElementById('inst'); if (o) { o.remove(); mostrarInstalar(true); } else mostrarInstalar(false); });
window.addEventListener('appinstalled', () => { const o = document.getElementById('inst'); if (o) o.remove(); renderBoxInst(); });
renderBoxInst();
setTimeout(() => mostrarInstalar(false), 1200);
</script>
