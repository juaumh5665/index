app = "stackos-wppconnect"
primary_region = "gru"

[build]
  image = "wppconnect/wppconnect-server:latest"

[env]
  SECRET_KEY = "StackOS2024WPP"
  HOST = "0.0.0.0"
  PORT = "21465"
  CUSTOM_USER_DATA_DIR = "/data/userDataDir/"
  TOKEN_STORE_TYPE = "file"

[http_service]
  internal_port = 21465
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = 1024

[mounts]
  source = "wpp_data"
  destination = "/data"
