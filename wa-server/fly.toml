app = "stackos-wppconnect"
primary_region = "gru"

[build]
  image = "atendai/evolution-api:v2.1.1"

[env]
  SERVER_PORT = "8080"
  AUTHENTICATION_API_KEY = "StackOS2024WPP"
  AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES = "true"
  DATABASE_PROVIDER = "postgresql"
  DATABASE_CONNECTION_URI = "postgresql://evolution_api.jvvgdkjohfomuafsafsx:EvoStackOS2024Wpp9x@aws-0-sa-east-1.pooler.supabase.com:5432/postgres"
  DATABASE_SAVE_DATA_INSTANCE = "true"
  DATABASE_SAVE_DATA_NEW_MESSAGE = "false"
  DATABASE_SAVE_MESSAGE_UPDATE = "false"
  DATABASE_SAVE_DATA_CONTACTS = "false"
  DATABASE_SAVE_DATA_CHATS = "false"
  CACHE_REDIS_ENABLED = "false"
  LOG_LEVEL = "WARN"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[mounts]
  source = "wpp_data"
  destination = "/evolution/store"
