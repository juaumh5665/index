app = "stackos-wppconnect"
primary_region = "gru"

[build]
  image = "wppconnect/server-cli:latest"

[env]
  HOST = "0.0.0.0"
  PORT = "21465"
  CORS_ORIGIN = "*"
  LOG_LEVEL = "info"

[http_service]
  internal_port = 21465
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[mounts]
  source = "wpp_data"
  destination = "/usr/src/wpp-server/tokens"
